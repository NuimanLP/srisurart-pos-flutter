worker_processes auto;
events { worker_connections 1024; }

http {
  # Without these the Flutter build's .js and .wasm files go out as text/plain
  # and the client never boots (07_CICD_DEPLOY.md §9).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","request_time":$request_time,'
    '"correlation_id":"$corr_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Reuse the client X-Correlation-ID, otherwise mint one.
  map $http_x_correlation_id $corr_id {
    default $http_x_correlation_id;
    ""      $request_id;
  }

  # Coarse per-IP limit (floods, pre-auth). Per-tenant limiting is a NestJS guard (#33).
  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
  limit_req_status 429;

  # Passive health only (free Nginx): an upstream is ejected after max_fails
  # connection-level failures within fail_timeout. Docker HEALTHCHECK has no
  # effect here. Static IPs (docker-compose.yml) keep DNS out of the failover
  # path: a recreated container keeps its address, and a stopped one fails
  # fast instead of resolving to nothing.
  upstream api {
    least_conn;
    server 172.30.0.11:3000 max_fails=2 fail_timeout=10s;
    server 172.30.0.12:3000 max_fails=2 fail_timeout=10s;
    server 172.30.0.13:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # A hung upstream must not pin worker connections.
    proxy_connect_timeout 2s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    # Fail over only on connection-level failures. Never on http_5xx: the app
    # answers 503 from /health/ready on purpose during an outage, and counting
    # that as a failure would eject every instance at once. Nginx never retries
    # a non-idempotent request (POST) once it has been sent.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID  $corr_id;

    # Blocks read specific → general; what actually decides is Nginx's
    # longest-prefix match, not their order (order matters only with regex).

    # Health probes: never rate limited, or the LB decides the instance is dead.
    location /health/ {
      proxy_pass http://api;
    }

    # Platform admin plane: loopback and admin IP only (ADR-0002, slice 24 / #270). Bull-Board is not
    # routed through Nginx at all — it is reachable only on the compose network
    # and on the host loopback port.
    # The path carries the app's global prefix (app.setup.ts sets 'api/v1'):
    # the old /platform/ block could never be requested (07 §9).
    location /api/v1/platform/ {
      allow 127.0.0.1;
      allow ::1;
      # TODO(owner): add specific admin IP(s) here if accessing from outside the server host,
      # e.g. `allow 203.0.113.10;`
      deny  all;
      limit_req zone=perip burst=60 nodelay;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=perip burst=60 nodelay;
      proxy_pass http://api;
    }

    # k6 distributed remote-write receiver (#251, docs/Backend_design/07_CICD_DEPLOY.md §10.3):
    # Prometheus's --web.enable-remote-write-receiver (deploy/compose/monitoring.yml) accepts
    # pushes from the k6 shards — three team laptops on the campus network, per the owner's
    # 2026-09-15 decision — with no new published port and no ufw change (still just 80/443).
    # Both an IP allowlist AND HTTP Basic Auth are required (nginx's default `satisfy all`).
    # Credentials come from K6_REMOTE_WRITE_BASIC_AUTH_USER/_PASSWORD in .env (never committed;
    # see .env.example) via the `htpasswd-gen` one-shot container (server/docker-compose.yml),
    # the same self-signed-placeholder pattern `certgen` already uses for the TLS cert.
    # Exact match, write endpoint only (07 §10.3) — NOT a prefix. A prefix here proxies
    # Prometheus's whole HTTP API (query/series/status/config/federate/metrics) to anyone with
    # the one shared credential; the k6 laptops only ever need to push.
    location = /prometheus-remote-write/api/v1/write {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      # TODO(owner): add the faculty campus's public IP range(s) here before the distributed k6
      # run, e.g. `allow 203.0.113.0/24;` — RFC1918 alone only covers a VPN/on-prem source, and
      # a laptop on the campus Wi-Fi has a campus-assigned address, not a private one.
      deny  all;

      auth_basic           "k6 remote write";
      auth_basic_user_file /etc/nginx/auth/k6-remote-write.htpasswd;

      # `prometheus` only exists when the monitoring overlay is composed in. Resolving it lazily
      # (Docker's embedded DNS, per request) rather than at startup means this location — and
      # therefore Nginx itself — still starts with no monitoring overlay (dev, CI); it just
      # 502s if actually hit. A static `proxy_pass http://prometheus:9090/…;` would instead fail
      # Nginx's own startup whenever `prometheus` isn't resolvable, exactly the "monitoring must
      # never fail a POS deploy" trap CLAUDE.md already documents for the Ansible side.
      # A variable in proxy_pass suppresses Nginx's usual "append the matched URI" behaviour, so
      # the target path has to be spelled out — harmless here since this is an exact-match
      # location, so it is always exactly this one path.
      resolver 127.0.0.11 valid=30s;
      set $prometheus_rw_upstream "http://prometheus:9090/api/v1/write";
      proxy_pass $prometheus_rw_upstream;
    }

    # Refuse every other path under the prefix explicitly, rather than falling through to the
    # SPA catch-all below (which would answer 200 with index.html for e.g.
    # /prometheus-remote-write/api/v1/query — not a leak, since nothing is proxied, but a
    # confusing non-refusal for what looks like a metrics endpoint). A prefix location is more
    # specific than `location /` for anything starting with this prefix, but the exact match
    # above still wins for the one real path regardless of the order these appear in.
    location /prometheus-remote-write/ {
      return 404;
    }

    # Prometheus scrapes /metrics directly from api containers on the compose network (D4 #335).
    # External requests through Nginx must be refused with 404, not fall through to the SPA
    # catch-all (which would answer 200 + index.html for what looks like a metrics endpoint).
    # Exact match, as D4 specifies, and not the prefix form `^~ /metrics`: the endpoint is
    # exactly one path, and a prefix location would also swallow every future path that merely
    # starts with these seven characters (an SPA route `/metrics-guide`, say), which is a
    # refusal nobody asked for. `/metrics/` therefore still falls through to the SPA — harmless,
    # since nothing under it is proxied to the API.
    location = /metrics {
      return 404;
    }

    # Service worker script must never be cached by the browser (08 §4 item 8, ADR-0013).
    location = /sw.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # Everything else is the web client (same origin as the API, so no CORS at
    # q1). No per-IP limit here: a cold Flutter load is a burst of static
    # requests that would trip `perip`. The volume that fills this root is
    # cd.1's job (#65); until it lands the stock image's own index.html
    # ("Welcome to nginx!") is served — Nginx still starts and /health/ and
    # /api/ keep working.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
