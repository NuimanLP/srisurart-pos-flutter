worker_processes auto;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"upstream_status":"$upstream_status"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  server {
    listen 80;

    # #443 PR4 (Q1-B, owner-approved 2026-09-27). This container is reached two ways, and
    # both must present as the compose network's bridge gateway:
    #  - The host's published loopback port 127.0.0.1:3200 (an `ssh -L` tunnel, same pattern
    #    as Grafana/Bull-Board) — docker-proxy opens a NEW connection into the container for
    #    every request, so the browser's own address never reaches here; $remote_addr is the
    #    bridge gateway (measured — see docs/Backend_design/07_CICD_DEPLOY.md "platform-ui").
    #  - Any other container on the compose network trying to reach 172.30.0.20 directly.
    # Without this, either path — or a stray container using this service as a relay — could
    # reach the main nginx's /api/v1/platform/ allowlist as an already-trusted `.20` peer.
    allow 172.30.0.1;
    deny  all;

    client_max_body_size 1m;

    # #443 PR4: strict headers for a static, same-origin dashboard with no inline script and
    # nothing it needs from another origin.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # #443 PR4 (Q9, owner-approved): the main nginx redirects every plain-HTTP request on
    # port 80 to HTTPS (docker/nginx/nginx.conf's `listen 80 { return 301 https://...; }`),
    # so this is not optional here — it must speak HTTPS to it. It trusts the same
    # self-signed cert `certgen` writes into the shared `certs` volume (mounted read-only in
    # docker-compose.yml) rather than turning verification off: `proxy_ssl_verify off` would
    # accept ANY certificate an attacker who reached this network presented as "nginx".
    # `proxy_ssl_name` is pinned to the certificate's own CN ("localhost", from certgen's
    # `-subj "/CN=localhost"`) because the upstream is reached by the Docker DNS name
    # `nginx`, which the certificate was never issued for — without this override,
    # hostname verification fails even with the right CA trusted.
    #
    # `resolver 127.0.0.11` + a variable in `proxy_pass` (rather than a bare
    # `proxy_pass https://nginx;`) resolves the upstream lazily, per request, so this
    # container starts and serves the dashboard even before the main `nginx` service exists
    # — the same reasoning already used for the k6 remote-write receiver above in
    # docker/nginx/nginx.conf. Because the variable carries no path, the client's own request
    # URI is forwarded unchanged (nginx's documented behaviour for a URI-less proxy_pass).
    location /api/v1/platform/ {
      resolver 127.0.0.11 valid=30s;
      set $upstream https://nginx;

      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/certs/server.crt;
      proxy_ssl_name localhost;
      proxy_ssl_server_name on;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host nginx;
      # Overwrite whatever XFF a caller sent — this container is the platform plane's ONLY
      # client-facing hop, so it must originate a clean XFF for the main nginx to append its
      # own hop to, never relay one it did not itself observe (CLAUDE.md: nginx must be the
      # only reverse proxy the API trusts; `trust proxy` = 1 expects exactly one appended hop
      # beyond what the client sent, and that client here is always this container itself).
      proxy_set_header X-Forwarded-For $remote_addr;

      add_header Cache-Control "no-store" always;
      proxy_pass $upstream;
    }

    # Service worker: never applicable to this static dashboard, refused rather than falling
    # through to the SPA catch-all (same reasoning as the main nginx.conf).
    location = /sw.js {
      return 404;
    }

    # The dashboard itself: plain HTML/JS/CSS, no build step.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
