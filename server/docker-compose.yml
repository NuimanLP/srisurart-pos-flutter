# Phase-1 stack (03_ARCHITECTURE.md §8, done-criterion 1):
#   Nginx → NestJS ×3 → PostgreSQL, redis-cache, redis-queue, etcd; + worker + Bull-Board.
# One command from a clean clone:  cp .env.example .env && docker compose up -d --build
# Secrets must be defined in server/.env (see .env.example).
#
# No datastore port is published to the host here: Postgres, both Redis and etcd talk only
# over the compose network. Local dev and CI add the loopback ports with the dev overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Never add that overlay on the VM.
#
# Memory budget (faculty VM 4 vCPU / 6 GB): 1024 + 2×256 + 3×384 + 256 + 128 + 64 + 256 (etcd)
# + 32 (platform-ui, #443 PR4) ≈ 3.35 GB.
# Connections: max_connections=100 → 3 api × (15 request + 2 audit + 1 health + 2 admin) +
# worker × (5 + 2 + 1 + 2) = 70 ≤ 80 (80%). The admin pool is platform-plane only, fixed at 2
# (server/README.md *Invariants this stack enforces*).
#
# Every external `image:` below is pinned `name:tag@sha256:<digest>` (#401), same policy as
# the base images in Dockerfile ("Base image digests are pinned and bumped by hand" — CLAUDE.md).
# Dependabot does not cover compose files (.github/dependabot.yml's `docker` ecosystem for
# `/server` only scans Dockerfile); these digests are bumped by hand too. `srisurart-pos/server:local`
# (built here) and the GHCR images in deploy/compose/vm.override.yml (built/pinned by our own CI)
# are out of scope for this pin.

name: srisurart-pos

x-app-env: &app-env
  DATABASE_URL: postgres://pos_app:${POS_APP_PASSWORD:?POS_APP_PASSWORD is required}@postgres:5432/pos
  # ADMIN_DATA_SOURCE (platform plane) connects as `postgres`; config.ts rebuilds that URL from
  # POSTGRES_PASSWORD and falls back to the dev default when it is absent — so without this line
  # any deployment with a real password crash-looped at boot (#184, first VM deploy).
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  # Signs platform-admin tokens (HS256). config.ts falls back to a public dev string, which
  # would let anyone forge an admin token on a real host — required here, never defaulted (#184).
  JWT_PLATFORM_SECRET: ${JWT_PLATFORM_SECRET:?JWT_PLATFORM_SECRET is required}
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-cache:6379
  REDIS_QUEUE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-queue:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # ioredis commandTimeout for the app's cache/health clients (#140); never BullMQ's.
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}
  # Dynamic config (#64/#66, 07_CICD_DEPLOY.md §8): the URL is not a secret (internal
  # compose DNS name), the root password is — same variable `etcd-init` below bootstraps
  # the store's root user with, so RuntimeConfigService authenticates against the same store.
  ETCD_URL: http://etcd:2379
  ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD is required}
  # Compose's `.env` is interpolation-only — there is no `env_file:` anywhere in this stack and
  # the image does not load dotenv, so a key is only inside the container if it is listed here.
  # CORS_ORIGINS defaults to empty on purpose: config.ts's `csvAllowlist` reads blank as
  # "unset", which keeps the historical behaviour (CORS `*`), while a value that lists no entry
  # (`,`) throws at boot instead of silently reopening CORS. A `:?` form here would break every
  # existing .env. Set it on the demo/VM host (#367).
  #   CORS_ORIGINS       comma-separated exact origins, e.g. https://mob04.example.ac.th
  #   PLATFORM_ADMIN_IPS comma-separated IPs allowed on /api/v1/platform/ IN ADDITION to loopback,
  #                      which platform-auth.guard.ts:43 allows before it reads this list (#270).
  #                      nginx's own `allow 127.0.0.1` on that location is unchanged, so an IP
  #                      added here is still refused a hop earlier unless nginx.conf follows.
  # PLATFORM_ADMIN_IPS defaults to the platform-ui container's fixed address (#443 PR4, owner
  # confirmed Q1-B) rather than empty: platform-ui is a permanent part of THIS compose file (not
  # an opt-in overlay), so a fresh `cp .env.example .env && docker compose up -d --build` must
  # already let it through the guard. 🔴 If this default is ever overridden on a host, the
  # override must still include 172.30.0.20, or platform-ui passes nginx's `allow` and then
  # dies at the guard (see docker-compose.yml's `platform-ui` service and
  # docs/Backend_design/07_CICD_DEPLOY.md "platform-ui" for the three things that move together).
  # Both also land on `worker` and `bull-board` through this anchor; neither serves the API, so
  # both variables are inert there — bull-board is protected by its loopback port + basic auth.
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  PLATFORM_ADMIN_IPS: ${PLATFORM_ADMIN_IPS:-172.30.0.20}
  # #443: `user:password,user:password` — platform admins every api instance upserts at boot
  # (main.ts → db/platform-admins-env.ts). Optional: blank = no sync. A bad entry (no `:`, empty
  # user, duplicate, password < 12 chars) or an unreachable Postgres exits the api (restart loop).
  # Names dropped from the list are kept in the DB. Inert on worker/bull-board (only main.ts reads it).
  PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}
  # #410: only `true` lets the app boot with the public placeholders from .env.example
  # (config.ts `refusePublicSecret`). Local dev / CI only; vm.override.yml forces it empty.
  ALLOW_DEV_SECRETS: ${ALLOW_DEV_SECRETS:-}
  # Tenant exports (`POST /backup/export`) are written here by `worker` and streamed back by
  # any api instance, so all four mount the `exports` volume below (x-api). Never put the
  # snapshot back into the BullMQ job: redis-queue is 192 MB with `noeviction`.
  EXPORT_DIR: /app/exports
  # Product images (contract §2): api writes them (PUT /products/:id/image), worker writes them
  # (backup ZIP import) and reads them (backup ZIP export); nginx serves them read-only at /img/.
  PRODUCT_IMAGES_DIR: /app/product-images

# Only api-1 carries `build:`; every other process reuses the image it produced
# (parallel builds of one tag race on the name).
x-api: &api
  image: srisurart-pos/server:local
  restart: unless-stopped
  mem_limit: 384m
  stop_grace_period: 30s
  # Shared by api-1..3 and worker (EXPORT_DIR / PRODUCT_IMAGES_DIR above). A fresh named volume
  # takes its node:node ownership from the image's /app/exports and /app/product-images (Dockerfile).
  volumes:
    - exports:/app/exports
    - product-images:/app/product-images
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis-cache: { condition: service_healthy }
    redis-queue: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/live"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
      - nginx-auth:/etc/nginx/auth:ro
      # /img/<tenantId>/<imageKey>_{t,p}.webp (nginx.conf) — read-only; only api/worker write.
      - product-images:/srv/product-images:ro
    depends_on:
      certgen: { condition: service_completed_successfully }
      htpasswd-gen: { condition: service_completed_successfully }
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
      api-3: { condition: service_healthy }

  # #443 PR4: static platform-admin web dashboard. Published ONLY on the host loopback
  # (127.0.0.1:3200, reached over `ssh -L`, same pattern as Grafana/Bull-Board) — never the
  # public interface. A fixed compose-network address is required because the main nginx's
  # `/api/v1/platform/` allowlist (docker/nginx/nginx.conf) and PLATFORM_ADMIN_IPS below both
  # name this container by IP, not by its (unstable across recreates) DNS name.
  # 🔴 Three things change together: this IP, the `allow` line in docker/nginx/nginx.conf, and
  # PLATFORM_ADMIN_IPS — see docs/Backend_design/07_CICD_DEPLOY.md "platform-ui".
  # 🔴 `deploy.yml:79-83` records that recreating this network drops every `ipv4_address`,
  # this one included — the same risk already documented there for api-1..3.
  # It never talks to `api` directly (see docker/platform-ui/nginx.conf): that would give the
  # API's guard an XFF rightmost of the bridge gateway unless the gateway itself were
  # allow-listed, which would turn `/api/v1/platform/` into an open relay for every other
  # container on this network. It proxies through the MAIN nginx instead — the plane's one
  # trusted hop (`trust proxy` = 1) — the same way a browser reaching the real thing would.
  platform-ui:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    mem_limit: 32m
    networks: { default: { ipv4_address: 172.30.0.20 } }
    ports:
      - "127.0.0.1:3200:80"
    volumes:
      - ./docker/platform-ui/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/platform-ui/html:/usr/share/nginx/html:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      # Needs the shared cert to trust the main nginx over HTTPS (its own nginx.conf) — NOT
      # the main `nginx` service itself, which it resolves lazily so it can start (and serve
      # the dashboard's static files) before `nginx` exists.
      certgen: { condition: service_completed_successfully }

  # TLS for dev/demo: a private CA (volume `certs-ca`, mounted nowhere else) signs the server
  # cert Nginx serves (volume `certs`). The Android API build trusts that CA's public cert —
  # docker/certgen/certgen.sh and 07_CICD_DEPLOY.md "TLS" say why and how it gets into the app.
  certgen:
    # No versioned tag is published upstream for this image — pinned against `latest` as of
    # 2026-09-25 (#401); the digest, not the tag, is what makes this reproducible.
    image: alpine/openssl:latest@sha256:6aa2be0ed55a61fff35583e5763c2ea8288bcd3549d316b954b01eec32fb7006
    entrypoint: sh
    command: ["/certgen.sh"]
    volumes:
      - ./docker/certgen/certgen.sh:/certgen.sh:ro
      - certs:/certs
      - certs-ca:/ca

  # HTTP Basic Auth for Nginx's /prometheus-remote-write/ location (#251) — the k6 distributed
  # run's Prometheus receiver. Same shape as `certgen` above: idempotent, generates into a named
  # volume so a re-run against an already-bootstrapped volume is a no-op. `openssl passwd -apr1`
  # writes an APR1-MD5 hash, a format Nginx's auth_basic accepts. dev-only credentials by default
  # (.env.example) — never committed for real; on the VM they come from DEMO_ENV_FILE (07 §10.3).
  htpasswd-gen:
    # Same image/digest as `certgen` above — no versioned tag upstream (#401).
    image: alpine/openssl:latest@sha256:6aa2be0ed55a61fff35583e5763c2ea8288bcd3549d316b954b01eec32fb7006
    entrypoint: sh
    command:
      - -c
      - >
        test -f /auth/k6-remote-write.htpasswd ||
        echo "$$K6_REMOTE_WRITE_BASIC_AUTH_USER:$$(openssl passwd -apr1 "$$K6_REMOTE_WRITE_BASIC_AUTH_PASSWORD")"
        > /auth/k6-remote-write.htpasswd
    environment:
      K6_REMOTE_WRITE_BASIC_AUTH_USER: ${K6_REMOTE_WRITE_BASIC_AUTH_USER:?K6_REMOTE_WRITE_BASIC_AUTH_USER is required}
      K6_REMOTE_WRITE_BASIC_AUTH_PASSWORD: ${K6_REMOTE_WRITE_BASIC_AUTH_PASSWORD:?K6_REMOTE_WRITE_BASIC_AUTH_PASSWORD is required}
    volumes:
      - nginx-auth:/auth

  # Schema comes only from migrations (#15), applied once here as the table owner
  # before any api/worker starts — never on boot, where three instances would race.
  migrate:
    image: srisurart-pos/server:local
    command: ["node", "dist/db/migrate.js", "up"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pos

  api-1:
    <<: *api
    networks: { default: { ipv4_address: 172.30.0.11 } }
    build: .
    environment:
      <<: *app-env
      INSTANCE_ID: api-1
      DB_POOL_SIZE: "${DB_POOL_SIZE:-15}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}"
      JWT_PUBLIC_KEYS: "${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS is required}"
  api-2:
    <<: *api
    networks: { default: { ipv4_address: 172.30.0.12 } }
    environment:
      <<: *app-env
      INSTANCE_ID: api-2
      DB_POOL_SIZE: "${DB_POOL_SIZE:-15}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}"
      JWT_PUBLIC_KEYS: "${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS is required}"
  api-3:
    <<: *api
    networks: { default: { ipv4_address: 172.30.0.13 } }
    environment:
      <<: *app-env
      INSTANCE_ID: api-3
      DB_POOL_SIZE: "${DB_POOL_SIZE:-15}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}"
      JWT_PUBLIC_KEYS: "${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS is required}"

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    mem_limit: 256m
    healthcheck: { disable: true }
    environment: { <<: *app-env, INSTANCE_ID: worker, DB_POOL_SIZE: "5" }

  bull-board:
    image: srisurart-pos/server:local
    command: ["node", "dist/bull-board.js"]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api-1: { condition: service_started }
    # Registers every queue in ALL_QUEUES (src/bull-board.ts) against redis-queue;
    # `<<: *app-env` below carries REDIS_QUEUE_URL with the password.
    environment:
      <<: *app-env
      PORT: "3100"
      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:?BULL_BOARD_PASSWORD is required}
    ports:
      # Host loopback only — never the public interface. Nginx does not proxy it, so on
      # the VM reach it through an SSH tunnel (ssh -L 3100:127.0.0.1:3100 …).
      - "127.0.0.1:3100:3100"

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    mem_limit: 1024m
    shm_size: 256m
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POS_APP_PASSWORD: ${POS_APP_PASSWORD:?POS_APP_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # No `ports:` — reachable only inside the compose network (docker-compose.dev.yml
    # publishes 127.0.0.1:5432 for local dev / e2e).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache: evict freely, nothing here is authoritative.
  redis-cache:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    # redis-cli reads the password from REDISCLI_AUTH, so it never lands in a command line.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue: never evict (a dropped job is a lost sale), persist with AOF.
  redis-queue:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 256m
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # KV storage for dynamic, non-secret config only (ADR-0013, 07_CICD_DEPLOY.md §8) — today
  # that is one key, `/pos/config/log_level` (RuntimeConfigService, #66). PostgreSQL stays the
  # source of truth for anything a shop's day depends on; nothing business-shaped goes here.
  # No `ports:` — reachable only inside the compose network, same as Postgres/Redis.
  #
  # gcr.io/etcd-development/etcd is the etcd project's own official image (Trivy: 30 fixed
  # HIGH/CRITICAL findings, 0 critical, no OS layer to patch — a maintained, tag-bumpable
  # image, unlike a frozen vendor rebuild). It still serves the v3 gRPC-gateway HTTP API
  # RuntimeConfigService talks to with plain `fetch` (`/v3/kv/range`, `/v3/watch`) — verified
  # directly against v3.6.12 with curl, not assumed from changelog text.
  #
  # It ships no shell (just the etcd/etcdctl/etcdutl binaries) and has no
  # `docker-entrypoint-initdb.d`-style hook the way `../postgres/init/` has for Postgres, so
  # auth bootstrap (create the root user, enable RBAC) is a separate one-shot job below
  # (`etcd-init`), the same shape as `certgen` bootstrapping the TLS cert.
  #
  # No non-root `user:` here: `/var/lib/etcd` in the image, and any fresh named volume
  # mounted over it, is root:root 0755 — an unprivileged uid cannot write there without an
  # extra chown step this ticket doesn't add (nothing else in this compose file runs as a
  # pinned non-root user either).
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.12@sha256:3c2ced08f23b1183e8bd4613064c3fb6b8db5057a4d1f13c3518c76e357a07a8
    restart: unless-stopped
    mem_limit: 256m
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=default=http://etcd:2380
    environment:
      # `endpoint health` performs a linearizable read, which etcd's RBAC refuses
      # anonymously once auth is enabled ("user name is empty") — ETCDCTL_USER (not a CLI
      # arg) authenticates the healthcheck below without the password landing in a command
      # line, same reasoning as REDISCLI_AUTH for Redis. Harmless before `etcd-init` has run
      # (auth disabled): etcd does not check credentials it isn't enforcing yet.
      #
      # 🔴 This is also the value RBAC actually holds — it is fixed at first bootstrap, not
      # kept in sync with this variable. Changing ETCD_ROOT_PASSWORD later without also
      # rotating it inside etcd (`etcdctl user passwd`) or resetting the `etcd-data` volume
      # makes THIS healthcheck itself start failing auth ("invalid user ID or password"),
      # which is how a silent mismatch becomes visible here — see `etcd-init.sh` and
      # `server/README.md` *Dynamic config* for what RuntimeConfigService does with the same
      # mismatch (fails open, one warning, no restart is possible into a working state).
      ETCDCTL_USER: root:${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD is required}
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: creates the etcd root user and enables RBAC auth on first boot, then asserts it
  # (root authenticates, an anonymous request is refused), then seeds `/pos/config/log_level`
  # from LOG_LEVEL if the key has never existed — see `docker/etcd/etcd-init.sh`.
  # Idempotent: a re-run against an already-bootstrapped volume short-circuits immediately.
  # No service depends on this succeeding (`condition: service_completed_successfully` is
  # deliberately not used anywhere) — the whole point of RuntimeConfigService's fail-open
  # design is that the API must boot with no working etcd at all. The VM deploy
  # (deploy/ansible/deploy.yml) runs it with `run --rm` instead, so a failure fails the deploy.
  etcd-init:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    restart: "no"
    mem_limit: 32m
    entrypoint: sh
    command: ["/etcd-init.sh"]
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:?ETCD_ROOT_PASSWORD is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./docker/etcd/etcd-init.sh:/etcd-init.sh:ro
    depends_on:
      etcd:
        condition: service_healthy

# Fixed subnet so the api instances can hold static addresses (see nginx.conf).
# Static addresses live in 172.30.0.2-.127; Docker hands out dynamic ones only from ip_range
# (.128-.255), so a container started while api-N is being recreated cannot take its address (#148).
# Every new `ipv4_address` must stay below .128. `gateway` is pinned to .1, which Docker would
# otherwise take from ip_range. Changing this block recreates the network on an existing host
# (07 §7 runbook).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1

volumes:
  pgdata:
  exports:
  # Product images (contract §2). Not in pg_dump: deploy/scripts/backup-db.sh archives it
  # separately. Never `down -v` — the images exist nowhere else.
  product-images:
  redis-queue-data:
  etcd-data:
  certs:
  # The private CA behind `certs` (certgen only). Losing it means a new CA and a rebuilt APK —
  # never `down -v` (07_CICD_DEPLOY.md "TLS").
  certs-ca:
  nginx-auth:
