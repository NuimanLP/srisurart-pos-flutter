---
# Release Deployment Playbook for Srisurart POS (ADR-0013, 07_CICD_DEPLOY.md §6).
# Deploys a tagged container release to the demo VM:
# 1. Checks if release is already running (early exit if identical SHA)
# 2. Synchronizes Compose definitions and Nginx configurations
# 3. Pulls GHCR release images
# 4. Executes one-shot 'web-sync' container to update the shared 'web' volume
# 5. Executes database migrations ('migrate' container: schema before code)
# 6. Performs rolling restart of api-1 -> api-2 -> api-3 with health checks
# 7. Restarts worker and bull-board, validates the copied nginx.conf in a throwaway container,
#    then force-recreates Nginx unconditionally (#249: a single-file bind mount keeps the old
#    inode after 'copy' renames a new file into place, so 'up -d --no-deps' alone -- and even
#    'nginx -s reload' -- would leave the OLD config running; same mechanism and fix as #148's
#    Prometheus/Grafana recreate below)
# 8. Verifies overall deployment health via GET /health/ready through Nginx
# 9. Records deployed SHA in /opt/pos/.current_sha
# 10. Copies the monitoring config, brings up the overlay and probes it on loopback. Steps 2-9 never
#     load monitoring.yml, so a monitoring image pull, config copy or missing GRAFANA_ADMIN_PASSWORD
#     cannot block a POS release; a failure in step 10 only warns (07 §6). With
#     enable_monitoring=false it removes monitoring containers left from an earlier deploy instead.

- name: Deploy Srisurart POS Release
  hosts: all
  become: false
  gather_facts: false

  vars:
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default(ansible_image_tag | default(''), true) }}"
    app_dir: "/opt/pos"
    repo_root: "{{ playbook_dir }}/../.."
    # Monitoring overlay (#121). On by default; `-e enable_monitoring=false` or
    # ENABLE_MONITORING=false skips it and removes its containers. When on, the VM's .env must carry
    # GRAFANA_ADMIN_PASSWORD, or the monitoring block warns and monitoring stays down. Toggling the
    # flag on a VM already running image_tag does nothing: the play ends at the duplicate-release
    # check below, so the change applies with the next release.
    enable_monitoring: "{{ lookup('env', 'ENABLE_MONITORING') | default('true', true) | bool }}"
    # POS steps use only the base + VM files. All three files share `name: srisurart-pos`, so a POS
    # `up` sees running monitoring containers as orphans: it warns and leaves them alone (no
    # --remove-orphans anywhere in this playbook).
    pos_compose_files: "-f docker-compose.yml -f vm.override.yml"
    monitoring_compose_files: "{{ pos_compose_files }} -f monitoring.yml"

  # monitoring.yml's bind mounts resolve against the project directory (/opt/pos); the config
  # trees are copied to /opt/pos/deploy/ below. Ansible merges this into each task's environment.
  environment:
    MONITORING_CONFIG_DIR: "./deploy"

  tasks:
    - name: Validate image_tag parameter
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
        fail_msg: "Deployment requires image_tag (pass via -e image_tag=<sha> or export IMAGE_TAG=<sha>)"

    - name: Check currently deployed SHA on VM
      ansible.builtin.slurp:
        src: "{{ app_dir }}/.current_sha"
      register: current_sha_file
      ignore_errors: true

    - name: Extract currently deployed SHA
      ansible.builtin.set_fact:
        current_sha: "{{ (current_sha_file.content | b64decode | trim) if (current_sha_file is succeeded and current_sha_file.content is defined) else '' }}"

    # `-e force_redeploy=true` redeploys the SHA .current_sha already names (#67): the automatic
    # rollback needs it, because .current_sha is written only after readiness passes and so still
    # names the previous release after a failed deploy. Never delete .current_sha to force instead:
    # if that redeploy fails too, the VM has lost its only record of what it runs.
    - name: Notify if release is already deployed
      ansible.builtin.debug:
        msg: "Release '{{ image_tag }}' is already active on {{ inventory_hostname }}. Skipping duplicate deployment."
      when: current_sha == image_tag and not (force_redeploy | default(false) | bool)

    - name: Early exit on duplicate release deployment
      ansible.builtin.meta: end_play
      when: current_sha == image_tag and not (force_redeploy | default(false) | bool)

    # docker-compose.yml's network gained ip_range (#148). Compose cannot change the IPAM of a network
    # that has containers attached: measured with compose v5.0.2, `run --rm` swaps the network under
    # the running containers and reconnects them WITHOUT their ipv4_address (api-N lose .11-.13, so
    # Nginx has no upstream), and `up -d <some services>` stops those services and then errors out.
    # So stop here, before anything is copied or started, and let a person take the one-time outage
    # (07 §7 runbook). A missing network (fresh VM, or after that step) passes.
    - name: Inspect the existing compose network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - srisurart-pos_default
          - --format
          - "{{ '{{' }}json .IPAM.Config{{ '}}' }}"
      register: pos_network
      changed_when: false
      failed_when: false

    - name: Refuse to deploy onto a network created before ip_range was added
      ansible.builtin.assert:
        that:
          - pos_network.rc != 0 or '172.30.0.128/25' in pos_network.stdout
        fail_msg: >-
          The srisurart-pos_default network on {{ inventory_hostname }} predates the ip_range in
          docker-compose.yml ({{ pos_network.stdout }}). Nothing was changed. Take the one-time
          network recreate in 07_CICD_DEPLOY.md §7 (a short full POS outage, volumes kept), then
          re-run this playbook.

    - name: Copy docker-compose base configuration
      ansible.builtin.copy:
        src: "{{ repo_root }}/server/docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copy VM Compose override configuration
      ansible.builtin.copy:
        src: "{{ repo_root }}/deploy/compose/vm.override.yml"
        dest: "{{ app_dir }}/vm.override.yml"
        mode: "0644"

    - name: Copy Nginx configuration
      ansible.builtin.copy:
        src: "{{ repo_root }}/server/docker/nginx/nginx.conf"
        dest: "{{ app_dir }}/docker/nginx/nginx.conf"
        mode: "0644"

    - name: Copy Postgres initialization scripts
      ansible.builtin.copy:
        src: "{{ repo_root }}/server/docker/postgres/init/"
        dest: "{{ app_dir }}/docker/postgres/init/"
        mode: "0755"

    # etcd-init bind-mounts ./docker/etcd/etcd-init.sh. Before this copy existed, the file was
    # missing on the VM, so Docker created that path as an empty root-owned DIRECTORY (and its
    # parent docker/etcd, also root-owned); etcd-init then ran `sh <directory>`, exited 0 with no
    # output, and auth was never enabled. Undo exactly that, once: rmdir removes only empty
    # directories, so anything unexpected fails loudly instead of being deleted. The `deploy` user
    # has no sudo (07 §6.2), so this runs as root in a container, the same Docker access every
    # other task here already uses; the image is read from compose so no tag is repeated.
    - name: Check for the etcd-init.sh directory Docker created on earlier deploys
      ansible.builtin.stat:
        path: "{{ app_dir }}/docker/etcd/etcd-init.sh"
      register: etcd_init_path

    # --no-interpolate: the interpolated config carries every secret from .env, and `-v` prints stdout.
    - name: Read the etcd-init image from the compose configuration
      ansible.builtin.command: "docker compose {{ pos_compose_files }} config --no-interpolate --format json etcd-init"
      args:
        chdir: "{{ app_dir }}"
      register: etcd_init_config
      changed_when: false
      when: etcd_init_path.stat.isdir | default(false)

    - name: Remove the Docker-created etcd-init.sh directory and its root-owned parent
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - "0:0"
          - --entrypoint
          - rmdir
          - --volume
          - "{{ app_dir }}/docker:/pos-docker"
          - "{{ (etcd_init_config.stdout | from_json).services['etcd-init'].image }}"
          - /pos-docker/etcd/etcd-init.sh
          - /pos-docker/etcd
      changed_when: true
      when: etcd_init_path.stat.isdir | default(false)

    - name: Ensure the etcd config directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/docker/etcd"
        state: directory
        mode: "0755"

    - name: Copy etcd-init bootstrap script
      ansible.builtin.copy:
        src: "{{ repo_root }}/server/docker/etcd/etcd-init.sh"
        dest: "{{ app_dir }}/docker/etcd/etcd-init.sh"
        mode: "0755"

    - name: Pull release images from GHCR
      ansible.builtin.command: "docker compose {{ pos_compose_files }} pull"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    - name: Populate shared web volume from web image (web-sync)
      ansible.builtin.command: "docker compose {{ pos_compose_files }} run --rm web-sync"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    - name: Apply database schema migrations (schema before code)
      ansible.builtin.command: "docker compose {{ pos_compose_files }} run --rm migrate"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    # etcd must be in this `up -d` line: every later step in this playbook uses --no-deps, so a
    # service missing here is never brought up by anything else. htpasswd-gen (#251) is the same
    # shape as certgen — idempotent, must exist before Nginx starts, and Nginx's own restart
    # below runs with --no-deps too.
    - name: Ensure backing datastores, certgen, htpasswd-gen and etcd are running
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d postgres redis-cache redis-queue certgen htpasswd-gen etcd"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    # etcd-init (#64/#67) enables auth, asserts it, and seeds /pos/config/log_level if missing.
    # `run` waits for etcd to be healthy (depends_on) and returns the job's exit code, so a
    # failure fails the deploy; `up -d` did not wait for one-shot jobs and stayed green. The API
    # itself still boots without etcd (RuntimeConfigService fails open); this gates the release on
    # the store being locked down, not the API on the store. Idempotent on an enabled store.
    - name: Bootstrap etcd auth and seed dynamic config (etcd-init)
      ansible.builtin.command: "docker compose {{ pos_compose_files }} run --rm etcd-init"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      register: etcd_init_run
      changed_when: "'etcd-init: bootstrapping' in etcd_init_run.stdout or 'etcd-init: seeded' in etcd_init_run.stdout"

    # Checked from a fresh container with no credentials, independent of etcd-init.sh itself: the
    # original bug made that script exit 0 without running, so its own assertion never fired.
    # Only 400 passes: etcd v3.6.12 answers an anonymous read with 400 "user name is empty" once auth
    # is on (measured). 200 means auth is off; any other code or a curl failure (rc != 0) means the
    # check did not prove anything.
    - name: Assert etcd refuses an unauthenticated read
      ansible.builtin.command: >-
        docker compose {{ pos_compose_files }} run --rm --no-deps --entrypoint curl etcd-init
        -sS -o /dev/null -w '%{http_code}' -X POST http://etcd:2379/v3/kv/range -d '{"key":"Lw=="}'
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      register: etcd_anonymous_read
      changed_when: false
      failed_when: etcd_anonymous_read.rc != 0 or (etcd_anonymous_read.stdout | trim) != '400'

    # Rolling restart: api-1
    - name: Restart instance api-1
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d --no-deps api-1"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for api-1 health check to pass
      ansible.builtin.shell: >
        docker inspect --format="{{ '{{' }} .State.Health.Status {{ '}}' }}"
        $(docker compose {{ pos_compose_files }} ps -q api-1)
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      register: api1_status
      retries: 25
      delay: 3
      until: api1_status.stdout | trim == "healthy"
      changed_when: false

    # Rolling restart: api-2
    - name: Restart instance api-2
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d --no-deps api-2"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for api-2 health check to pass
      ansible.builtin.shell: >
        docker inspect --format="{{ '{{' }} .State.Health.Status {{ '}}' }}"
        $(docker compose {{ pos_compose_files }} ps -q api-2)
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      register: api2_status
      retries: 25
      delay: 3
      until: api2_status.stdout | trim == "healthy"
      changed_when: false

    # Rolling restart: api-3
    - name: Restart instance api-3
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d --no-deps api-3"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for api-3 health check to pass
      ansible.builtin.shell: >
        docker inspect --format="{{ '{{' }} .State.Health.Status {{ '}}' }}"
        $(docker compose {{ pos_compose_files }} ps -q api-3)
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      register: api3_status
      retries: 25
      delay: 3
      until: api3_status.stdout | trim == "healthy"
      changed_when: false

    # Background workers
    - name: Restart worker and bull-board
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d --no-deps worker bull-board"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"

    # nginx.conf is a single-file bind mount (docker-compose.yml). ansible.builtin.copy above wrote
    # a temp file and renamed it into place -- new inode, same path -- and a container's bind mount
    # stays pinned to the inode it had when it (re)started, so 'up -d --no-deps nginx' is a no-op
    # whenever the compose service definition itself is unchanged and nginx keeps serving the OLD
    # config indefinitely; 'nginx -s reload' does not help either, since the reloaded worker reads
    # through that same stale mount (#249 -- proved against a real Linux bind mount, in a
    # docker:27-dind daemon; a plain Windows-host Docker Desktop bind mount does NOT reproduce this,
    # because its file-sharing layer re-resolves by path rather than pinning an inode, so it would
    # have hidden the bug). Test the just-copied file in a fresh, disposable container BEFORE
    # touching the running one, so a bad nginx.conf fails the deploy with the OLD config still
    # serving traffic instead of taking Nginx down.
    - name: Validate the copied Nginx configuration
      ansible.builtin.command: "docker compose {{ pos_compose_files }} run --rm --no-deps nginx nginx -t"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      changed_when: false

    # Always recreate, never "only when this run's copy changed nginx.conf" -- the same reasoning
    # #148 already established for Prometheus/Grafana below: a run that copies a new nginx.conf and
    # then fails a later task (a rolling-restart health check, the readiness probe) never reaches
    # this step, so the next run's copy reports no change and a changed-gated recreate would skip
    # Nginx forever. The cost is a brief Nginx restart (a short blip for any in-flight connection,
    # same class as the rolling-restart caveat already documented in 07 §6) on every deploy, even
    # one that didn't touch nginx.conf; the task above has already proven the config valid.
    - name: Recreate Nginx so it loads the copied config
      ansible.builtin.command: "docker compose {{ pos_compose_files }} up -d --no-deps --force-recreate nginx"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    # Cluster health probe via Nginx
    - name: Verify cluster readiness via Nginx (GET /health/ready)
      ansible.builtin.uri:
        url: "https://127.0.0.1/health/ready"
        validate_certs: false
        status_code: 200
      register: cluster_ready
      retries: 15
      delay: 3
      until: cluster_ready.status == 200

    - name: Record deployed SHA in .current_sha
      ansible.builtin.copy:
        content: "{{ image_tag }}\n"
        dest: "{{ app_dir }}/.current_sha"
        mode: "0644"

    # Monitoring overlay (#121): host loopback only, reached over an SSH tunnel (07 §7).
    # Everything monitoring touches (its compose file, config trees, images) runs here, after the
    # POS release is verified and recorded, and a failure only warns (07 §6).
    - name: Monitoring overlay
      when: enable_monitoring | bool
      block:
        - name: Copy monitoring overlay Compose configuration
          ansible.builtin.copy:
            src: "{{ repo_root }}/deploy/compose/monitoring.yml"
            dest: "{{ app_dir }}/monitoring.yml"
            mode: "0644"

        - name: Copy Prometheus and Grafana configuration trees
          ansible.builtin.copy:
            src: "{{ repo_root }}/deploy/{{ item }}/"
            dest: "{{ app_dir }}/deploy/{{ item }}/"
            mode: "0644"
            directory_mode: "0755"
          loop:
            - prometheus
            - grafana

        # copy never deletes: a dashboard removed or renamed in the repo would stay provisioned
        - name: List monitoring config files in the repo
          ansible.builtin.find:
            paths:
              - "{{ repo_root }}/deploy/prometheus"
              - "{{ repo_root }}/deploy/grafana"
            recurse: true
          delegate_to: localhost
          register: monitoring_config_repo

        - name: List monitoring config files on the VM
          ansible.builtin.find:
            paths:
              - "{{ app_dir }}/deploy/prometheus"
              - "{{ app_dir }}/deploy/grafana"
            recurse: true
          register: monitoring_config_vm

        # Compare paths relative to each tree root. Never resolve symlinks on one side only: run
        # through a symlinked path (macOS /tmp -> /private/tmp) the prefixes stop matching and every
        # config file on the VM is deleted.
        - name: Remove monitoring config files no longer in the repo
          ansible.builtin.file:
            path: "{{ app_dir }}/deploy/{{ item }}"
            state: absent
          loop: "{{ vm_files | difference(repo_files) }}"
          vars:
            repo_files: "{{ monitoring_config_repo.files | map(attribute='path') | map('relpath', repo_root ~ '/deploy') | list }}"
            vm_files: "{{ monitoring_config_vm.files | map(attribute='path') | map('relpath', app_dir ~ '/deploy') | list }}"

        - name: Pull monitoring images
          ansible.builtin.command: "docker compose {{ monitoring_compose_files }} pull node-exporter prometheus grafana"
          environment:
            IMAGE_TAG: "{{ image_tag }}"
          args:
            chdir: "{{ app_dir }}"

        - name: Bring up node-exporter
          ansible.builtin.command: "docker compose {{ monitoring_compose_files }} up -d node-exporter"
          environment:
            IMAGE_TAG: "{{ image_tag }}"
          args:
            chdir: "{{ app_dir }}"

        # Always recreate, never "only when this run changed the config" (#148). A single-file bind
        # mount keeps the old inode after copy's atomic rename and the compose config hash does not
        # change, so only a recreate loads new config. Gating that on this run's copy result lost the
        # change for good when a run copied the file and then failed later in this block: the next
        # release copied nothing, and Prometheus kept the old config. A checksum of the mounted file
        # cannot replace this either: Grafana's provisioning mounts are directories, which already
        # show the new files while Grafana still runs what it read at startup. This block runs only
        # for a new image_tag, so the cost is a few seconds of monitoring gap per release; the
        # TSDB and Grafana state are named volumes and survive. Dependencies (node-exporter) are
        # not force-recreated.
        - name: Recreate Prometheus and Grafana so they load the copied config
          ansible.builtin.command: "docker compose {{ monitoring_compose_files }} up -d --force-recreate prometheus grafana"
          environment:
            IMAGE_TAG: "{{ image_tag }}"
          args:
            chdir: "{{ app_dir }}"
          changed_when: true

        - name: Verify Prometheus and Grafana answer on host loopback
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
          loop:
            - "http://127.0.0.1:9090/-/healthy"
            - "http://127.0.0.1:3000/api/health"
          register: monitoring_ready
          retries: 20
          delay: 3
          until: monitoring_ready.status == 200
      rescue:
        - name: Warn that monitoring is unhealthy (POS release is unaffected)
          ansible.builtin.debug:
            msg: >-
              WARNING: release '{{ image_tag }}' is deployed and healthy, but the monitoring overlay
              failed on {{ inventory_hostname }}:
              {{ ansible_failed_result.stderr | default('', true) or ansible_failed_result.msg | default('see task output above') }}.
              Check `docker compose {{ monitoring_compose_files }} ps` in {{ app_dir }}.
              Re-running this playbook with the same image_tag stops at the duplicate-release check,
              so after fixing the cause either wait for the next release or delete
              {{ app_dir }}/.current_sha and re-run this tag (that repeats the whole POS rollout).

    # The stale monitoring.yml still requires GRAFANA_ADMIN_PASSWORD at interpolation, even for rm;
    # without a placeholder a removed password makes compose refuse and the containers keep running.
    - name: Remove monitoring containers left from an earlier deploy
      ansible.builtin.command: "docker compose {{ monitoring_compose_files }} rm -sf node-exporter prometheus grafana"
      environment:
        IMAGE_TAG: "{{ image_tag }}"
        GRAFANA_ADMIN_PASSWORD: "unused"
      args:
        chdir: "{{ app_dir }}"
        removes: "{{ app_dir }}/monitoring.yml"
      register: monitoring_removed
      failed_when: false
      when: not (enable_monitoring | bool)

    # failed_when: false keeps a broken rm from failing a POS release that is already recorded, but
    # it must not be silent: a failed rm leaves the monitoring containers running (#148). A missing
    # rc (the module failed before running anything) counts as a failure; the `removes:` skip when
    # monitoring.yml was never copied reports rc 0.
    - name: Warn that monitoring containers could not be removed (POS release is unaffected)
      ansible.builtin.debug:
        msg: >-
          WARNING: enable_monitoring=false, but removing the monitoring containers failed on
          {{ inventory_hostname }} (rc={{ monitoring_removed.rc | default('none') }}):
          {{ monitoring_removed.stderr | default('', true) or monitoring_removed.msg | default('see task output above') }}.
          node-exporter, Prometheus and Grafana may still be running; check
          `docker compose {{ monitoring_compose_files }} ps` in {{ app_dir }}.
      when:
        - not (enable_monitoring | bool)
        - monitoring_removed.rc | default(1) != 0

    - name: Log successful deployment completion
      ansible.builtin.debug:
        msg: "Successfully deployed release '{{ image_tag }}' to {{ inventory_hostname }}."
