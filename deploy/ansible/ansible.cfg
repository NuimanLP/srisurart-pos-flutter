[defaults]
# SSH host keys ARE checked (Ansible's default; `host_key_checking = False` removed 2026-10-13).
# Pin the host's key in ~/.ssh/known_hosts first: ssh-keyscan, checked against the fingerprint
# read on the host's own console (07_CICD_DEPLOY.md §7, row "SSH host key"). CD never SSHes:
# pos-deploy.sh runs this playbook with ansible_connection=local on the VM.
inventory = inventory/hosts.ini
retry_files_enabled = False
deprecation_warnings = False
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
