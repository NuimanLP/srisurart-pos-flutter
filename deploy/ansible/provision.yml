---
# Provisioning Playbook for Srisurart POS Demo VM (ADR-0013, 07_CICD_DEPLOY.md §6).
# Prepares a clean Ubuntu/Debian VM for automated deployment:
# - Installs Docker Engine + Docker Compose plugin
# - Creates 'deploy' user with docker group membership & SSH authorized keys
# - Configures UFW firewall (allows 22/80/443, denies all other incoming)
# - Sets up /opt/pos/ application directory structure and initial .env (mode 0600)

- name: Provision Srisurart POS Demo VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    deploy_user: "deploy"
    app_dir: "/opt/pos"
    demo_ssh_pub_key: "{{ lookup('env', 'DEMO_SSH_KEY_PUB') | default(lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') | default('', true), true) }}"
    demo_env_content: "{{ lookup('env', 'DEMO_ENV_FILE') | default('', true) }}"

  tasks:
    - name: Ensure base dependencies are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - openssl
        state: present
        update_cache: yes

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker repository to APT sources
      ansible.builtin.copy:
        # apt wants the Debian arch name (amd64/arm64); ansible_architecture is the kernel's
        # (x86_64/aarch64), which matches no package list — docker-ce is then "not available".
        content: "deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"

    - name: Install Docker Engine, CLI, and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker daemon is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Configure UFW firewall (22/80/443 only)
      ansible.builtin.command: "{{ item }}"
      loop:
        - ufw default deny incoming
        - ufw default allow outgoing
        - ufw allow 22/tcp
        - ufw allow 80/tcp
        - ufw allow 443/tcp
        - ufw --force enable
      changed_when: false

    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: "{{ deploy_user }}"
        state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        groups:
          - docker
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure SSH authorized key for deploy user
      ansible.builtin.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ demo_ssh_pub_key }}"
        state: present
      when: demo_ssh_pub_key != ""

    - name: Create application directories under /opt/pos
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/docker"
        - "{{ app_dir }}/docker/etcd"
        - "{{ app_dir }}/docker/nginx"
        - "{{ app_dir }}/docker/postgres"
        - "{{ app_dir }}/docker/postgres/init"
        - '{{ app_dir }}/scripts'

    # The ops scripts a person runs ON the VM. This playbook is the only installer for them, and it
    # is `become: true` -- deploy.yml cannot do this job: it runs `become: false` as the release
    # user, /opt/pos is `drwxr-xr-x deploy:deploy`, and the release user is not in group `deploy`.
    # Consequence to know: editing one of these scripts in the repo does NOT reach the VM on the
    # next release -- re-run THIS playbook.
    # Only scripts whose runtime is the VM belong here. Deliberately excluded: pos-deploy.sh and
    # runner-job-started.sh (the owner installs those into /usr/local/bin, 07 §6.2), and
    # setup-mob04-runner.sh / validate.sh / verify-ghcr-tags.sh (repo- and CI-side).
    - name: Install the ops scripts the VM runs (Slice 23 / #288, #184, #346)
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../scripts/{{ item }}'
        dest: '{{ app_dir }}/scripts/{{ item }}'
        owner: '{{ deploy_user }}'
        group: '{{ deploy_user }}'
        mode: '0755'
      loop:
        # the daily cron target below
        - backup-db.sh
        # the recovery half of #288 -- useless on the day it is needed if it lives only in the repo
        - restore-db.sh
        # step 2.2 of the #184 RSS runbook invokes this by absolute path
        - measure-container-rss.sh
        # the 5-minute uptime heartbeat cron target at the end of this playbook
        - healthcheck-ping.sh

    # An unset DEMO_ENV_FILE is a legitimate re-provision that leaves .env alone — but it used to
    # happen without a word, and read like the .env had been written.
    - name: Warn that .env is left untouched (DEMO_ENV_FILE unset)
      ansible.builtin.debug:
        msg: "DEMO_ENV_FILE is empty or unset — {{ app_dir }}/.env was NOT written. Export it to change the VM's configuration."
      when: demo_env_content == ""

    # Every `${KEY:?}` in docker-compose.yml / monitoring.yml (IMAGE_TAG comes from deploy.yml).
    # A missing one used to surface only later, as a Compose interpolation error mid-deploy.
    # Loop output names the key, never its value.
    - name: Check DEMO_ENV_FILE carries every key Compose requires
      ansible.builtin.assert:
        that:
          - demo_env_content is search('(?m)^' ~ item ~ '=\S')
        fail_msg: "DEMO_ENV_FILE has no non-empty {{ item }}= line. Compose refuses to start without it."
        quiet: true
      loop:
        - POSTGRES_PASSWORD
        - POS_APP_PASSWORD
        - REDIS_PASSWORD
        - ETCD_ROOT_PASSWORD
        - JWT_PLATFORM_SECRET
        - JWT_PRIVATE_KEY
        - JWT_PUBLIC_KEYS
        - K6_REMOTE_WRITE_BASIC_AUTH_USER
        - K6_REMOTE_WRITE_BASIC_AUTH_PASSWORD
        - BULL_BOARD_PASSWORD
        - GRAFANA_ADMIN_PASSWORD
      when: demo_env_content != ""

    # PLATFORM_ADMINS is optional to Compose, but without it (and without a bootstrap-admin run)
    # the stack comes up green with no platform admin, and nobody can log in to platform-ui.
    - name: Warn when no platform admin is configured
      ansible.builtin.debug:
        msg: "DEMO_ENV_FILE has no PLATFORM_ADMINS= line — platform-ui (127.0.0.1:3200) will have no admin to log in with unless one already exists in the database."
      when: demo_env_content != "" and demo_env_content is not search('(?m)^PLATFORM_ADMINS=\S')

    # HEALTHCHECKS_PING_URL is optional too: without it the heartbeat cron logs one ::warning::
    # every 5 minutes and pings nothing, so nobody is told when the VM goes down.
    - name: Warn when no uptime heartbeat is configured
      ansible.builtin.debug:
        msg: "DEMO_ENV_FILE has no HEALTHCHECKS_PING_URL= line — the uptime heartbeat cron will run but send nothing (see healthcheck-ping.sh)."
      when: demo_env_content != "" and demo_env_content is not search('(?m)^HEALTHCHECKS_PING_URL=\S')

    # `DEMO_ENV_FILE="$(cat file)"` strips the file's final newline, so without the
    # fix-up below the last line had none and a key appended by hand later glued onto
    # it (Compose then reports that key missing). Add one newline only when absent.
    # no_log + diff: false — `--diff` would otherwise print the whole file. The containers pick the
    # new file up on the next deploy.yml run, which sees the .env checksum change and rolls out.
    - name: Write server .env configuration (0600 mode)
      ansible.builtin.copy:
        content: "{{ demo_env_content if demo_env_content.endswith('\n') else demo_env_content ~ '\n' }}"
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      when: demo_env_content != ""
      no_log: true
      diff: false

    - name: Create backup directory (0700 mode, Slice 23 / #288)
      ansible.builtin.file:
        path: "{{ app_dir }}/backups"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    # `>/dev/null 2>&1` was the whole mechanism of #346: the script was missing, cron said so on
    # stderr, and the redirect threw the message away, so the backup could fail every night for a
    # week and look exactly like success. Append to a log instead -- one file to read to answer "did
    # last night's backup run?". The prune in backup-db.sh matches only `*_backup_*.sql.gz[.sha256|.uploaded]`,
    # so the log survives it. Still not an alarm: nothing pages on a failed backup (see #346).
    # Deliberately no rotation, with the arithmetic so nobody re-litigates it: backup-db.sh prints
    # ~10 short lines per run, once a day -- order of 100 KB/year against 42 GB free on this VM.
    # Rotation would be more moving parts than the thing it guards. If the log is ever made chatty
    # (per-table output, a verbose pg_dump), add logrotate at the same time.
    # Note the redirect is opened by the shell BEFORE backup-db.sh runs, so it depends on the
    # `backups` directory task above having succeeded; that task is immediately above this one for
    # exactly that reason -- do not reorder them.
    # 🔴 #363 (owner decision 2026-09-21): offsite upload is OPTIONAL. With no
    # BACKUP_RCLONE_REMOTE set -- which is the case here, until the owner picks a destination and
    # creates credentials (#363 AC1; docs/Backend_design/07_CICD_DEPLOY.md §7a) -- backup-db.sh
    # logs one `::warning::` to backup-cron.log and exits 0, so this cron job is quiet but honest
    # instead of failing every night. Once BACKUP_RCLONE_REMOTE *is* set, a broken offsite step
    # (no rclone, missing config, failed copy) still exits non-zero on purpose.
    # This job is NOT changed by #363 and does not yet set BACKUP_RCLONE_REMOTE/BACKUP_RCLONE_CONFIG
    # -- when the owner is ready, add an `environment:` block to this task (or prefix `job:`) with
    # those two vars, pointing BACKUP_RCLONE_CONFIG at a file this playbook does NOT manage (no
    # credential belongs in this repo or in `demo_env_content`).
    - name: Configure daily database backup cron job (Slice 23 / #288, #346)
      ansible.builtin.cron:
        name: "Srisurart POS Daily Database Backup"
        user: "{{ deploy_user }}"
        minute: "0"
        hour: "3"
        job: "{{ app_dir }}/scripts/backup-db.sh {{ app_dir }}/backups >>{{ app_dir }}/backups/backup-cron.log 2>&1"
        state: present

    # Uptime heartbeat (Healthchecks.io): the VM reports in; silence is the alarm, so a dead VM
    # pages too — which an uptime monitor running on this same VM never could.
    # The ping URL is read from {{ app_dir }}/.env (HEALTHCHECKS_PING_URL) at every run, so it
    # changes with the .env, not with this playbook; unset = one ::warning:: per run, exit 0.
    # Output goes to syslog rather than a file: 288 runs a day would want rotation, and journald
    # already rotates. Read it with `journalctl -t pos-healthcheck`.
    # Needs outbound HTTPS from the VM to hc-ping.com through the faculty FortiGate — test with
    # `curl -v https://hc-ping.com/` before relying on it (the same block hit ghcr.io until 2026-09-29).
    - name: Configure uptime heartbeat cron job (Healthchecks.io)
      ansible.builtin.cron:
        name: "Srisurart POS Uptime Heartbeat"
        user: "{{ deploy_user }}"
        minute: "*/5"
        job: "{{ app_dir }}/scripts/healthcheck-ping.sh 2>&1 | logger -t pos-healthcheck"
        state: present
