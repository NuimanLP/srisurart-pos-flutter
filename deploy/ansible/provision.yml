---
# Provisioning Playbook for Srisurart POS Demo VM (ADR-0013, 07_CICD_DEPLOY.md §6).
# Prepares a clean Ubuntu/Debian VM for automated deployment:
# - Installs Docker Engine + Docker Compose plugin
# - Creates 'deploy' user with docker group membership & SSH authorized keys
# - Configures UFW firewall (allows 22/80/443, denies all other incoming)
# - Sets up /opt/pos/ application directory structure and initial .env (mode 0600)

- name: Provision Srisurart POS Demo VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    deploy_user: "deploy"
    app_dir: "/opt/pos"
    demo_ssh_pub_key: "{{ lookup('env', 'DEMO_SSH_KEY_PUB') | default(lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') | default('', true), true) }}"
    demo_env_content: "{{ lookup('env', 'DEMO_ENV_FILE') | default('', true) }}"

  tasks:
    - name: Ensure base dependencies are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - openssl
        state: present
        update_cache: yes

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker repository to APT sources
      ansible.builtin.copy:
        # apt wants the Debian arch name (amd64/arm64); ansible_architecture is the kernel's
        # (x86_64/aarch64), which matches no package list — docker-ce is then "not available".
        content: "deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"

    - name: Install Docker Engine, CLI, and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker daemon is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Configure UFW firewall (22/80/443 only)
      ansible.builtin.command: "{{ item }}"
      loop:
        - ufw default deny incoming
        - ufw default allow outgoing
        - ufw allow 22/tcp
        - ufw allow 80/tcp
        - ufw allow 443/tcp
        - ufw --force enable
      changed_when: false

    - name: Ensure deploy group exists
      ansible.builtin.group:
        name: "{{ deploy_user }}"
        state: present

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        groups:
          - docker
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure SSH authorized key for deploy user
      ansible.builtin.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ demo_ssh_pub_key }}"
        state: present
      when: demo_ssh_pub_key != ""

    - name: Create application directories under /opt/pos
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/docker"
        - "{{ app_dir }}/docker/etcd"
        - "{{ app_dir }}/docker/nginx"
        - "{{ app_dir }}/docker/postgres"
        - "{{ app_dir }}/docker/postgres/init"
        - '{{ app_dir }}/scripts'

    # The ops scripts a person runs ON the VM. This playbook is the only installer for them, and it
    # is `become: true` -- deploy.yml cannot do this job: it runs `become: false` as the release
    # user, /opt/pos is `drwxr-xr-x deploy:deploy`, and the release user is not in group `deploy`.
    # Consequence to know: editing one of these scripts in the repo does NOT reach the VM on the
    # next release -- re-run THIS playbook.
    # Only scripts whose runtime is the VM belong here. Deliberately excluded: pos-deploy.sh and
    # runner-job-started.sh (the owner installs those into /usr/local/bin, 07 §6.2), and
    # setup-mob04-runner.sh / validate.sh / verify-ghcr-tags.sh (repo- and CI-side).
    - name: Install the ops scripts the VM runs (Slice 23 / #288, #184, #346)
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../scripts/{{ item }}'
        dest: '{{ app_dir }}/scripts/{{ item }}'
        owner: '{{ deploy_user }}'
        group: '{{ deploy_user }}'
        mode: '0755'
      loop:
        # the daily cron target below
        - backup-db.sh
        # the recovery half of #288 -- useless on the day it is needed if it lives only in the repo
        - restore-db.sh
        # step 2.2 of the #184 RSS runbook invokes this by absolute path
        - measure-container-rss.sh

    - name: Write server .env configuration (0600 mode)
      ansible.builtin.copy:
        content: "{{ demo_env_content }}"
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      when: demo_env_content != ""

    - name: Create backup directory (0700 mode, Slice 23 / #288)
      ansible.builtin.file:
        path: "{{ app_dir }}/backups"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    # `>/dev/null 2>&1` was the whole mechanism of #346: the script was missing, cron said so on
    # stderr, and the redirect threw the message away, so the backup could fail every night for a
    # week and look exactly like success. Append to a log instead -- one file to read to answer "did
    # last night's backup run?". The prune in backup-db.sh:108 matches only `*_backup_*.sql.gz[.sha256]`,
    # so the log survives it. Still not an alarm: nothing pages on a failed backup (see #346).
    - name: Configure daily database backup cron job (Slice 23 / #288, #346)
      ansible.builtin.cron:
        name: "Srisurart POS Daily Database Backup"
        user: "{{ deploy_user }}"
        minute: "0"
        hour: "3"
        job: "{{ app_dir }}/scripts/backup-db.sh {{ app_dir }}/backups >>{{ app_dir }}/backups/backup-cron.log 2>&1"
        state: present
