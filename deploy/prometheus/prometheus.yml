# Scrape config for the `prometheus` service in ../compose/monitoring.yml (#63 `ops.1`).
# Owning doc: docs/Backend_design/07_CICD_DEPLOY.md §10 · ADR-0013.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Extra jobs dropped in by an overlay (deploy/compose/observability.yml mounts
# ../prometheus-local/local-scrape.yml here). A glob that matches nothing is not an error, so on the VM — where
# nothing is mounted — this line does nothing.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

scrape_configs:
  # Host CPU / memory / disk — the dashboard's three host panels
  # (../grafana/dashboards/pos-overview.json).
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # No `api-readiness` job (removed 2026-10-21): /health/ready answers JSON, which Prometheus 3 refuses
  # ("unsupported Content-Type") and 2.x failed to parse, so its `up` was always 0 and nothing used it.
  # Readiness is watched by Gatus (../gatus/config.yaml, through Nginx+TLS); the API's own metrics below.

  # Enabled via #339 metrics.serve / #340 metrics.dashboard (internal-only per
  # 02_API_SCREENS.md's endpoint table — never routed through the public Nginx surface).
  - job_name: api-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ['api-1:3000', 'api-2:3000', 'api-3:3000']

  # Gatus's own metrics (gatus_results_*, `metrics: true` in ../gatus/config.yaml). Its `up` is
  # what Grafana's "Gatus down" rule watches (../grafana/provisioning/alerting/pos-alerts.yml).
  - job_name: gatus
    static_configs:
      - targets: ['gatus:8080']
