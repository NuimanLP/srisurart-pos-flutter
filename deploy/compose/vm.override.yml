# Production/Demo VM override for srisurart-pos compose stack (ADR-0013, 07_CICD_DEPLOY.md §6).
# - Replaces local images with GHCR release images tagged with ${IMAGE_TAG}
# - Removes `build:` from api-1 so Compose doesn't expect source code on the VM
# - Adds one-shot `web-sync` container to populate the shared `web` volume
# - Mounts `web` volume into Nginx container at /usr/share/nginx/html
# - Forces ALLOW_DEV_SECRETS empty on every app process (#410), whatever the VM .env says

name: srisurart-pos

services:
  migrate:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}

  api-1:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}
    build: !reset []
    environment: { ALLOW_DEV_SECRETS: "" } # #410: never trust .env.example placeholders here

  api-2:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}
    environment: { ALLOW_DEV_SECRETS: "" } # #410: never trust .env.example placeholders here

  api-3:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}
    environment: { ALLOW_DEV_SECRETS: "" } # #410: never trust .env.example placeholders here

  worker:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}
    environment: { ALLOW_DEV_SECRETS: "" } # #410: never trust .env.example placeholders here

  bull-board:
    image: ghcr.io/nuimanlp/srisurart-pos-server:${IMAGE_TAG:?IMAGE_TAG is required}
    environment: { ALLOW_DEV_SECRETS: "" } # #410: never trust .env.example placeholders here

  nginx:
    volumes:
      - web:/usr/share/nginx/html:ro

  # One-shot container to copy Flutter web assets into the shared volume Nginx is serving from.
  # Never empty the volume first: every file is written to a temp name and renamed over the old one
  # (rename is atomic), so a request never sees a missing or half-written file. The files that
  # name other files go last — flutter_bootstrap.js, sw.js, then index.html — so nothing new ever
  # points at a file not copied yet. Then files not in this release (the stock Nginx index/50x
  # pages on a fresh volume, the previous release's leftovers, a killed run's temp files) are
  # removed — except the previous release's `main.<release>.dart.js` (deploy/version-web-build.sh),
  # so a page load that fetched the old flutter_bootstrap.js before the swap still finds its own
  # entry point. That file goes on the next deploy: exactly one old entry point is ever kept.
  # Other unversioned files (assets/, drift_worker.js, sqlite3.wasm) can still mix across a swap.
  # `$$` is Compose's escape for a literal `$`.
  web-sync:
    image: ghcr.io/nuimanlp/srisurart-pos-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    command:
      - sh
      - -euc
      - |
        prev=$$(grep -o 'main\.[0-9a-z][0-9a-z]*\.dart\.js' /target/flutter_bootstrap.js 2>/dev/null | head -n 1 || true)
        put() {
          cp -p "$$1" "/target/$$1.web-sync-tmp"
          mv -f "/target/$$1.web-sync-tmp" "/target/$$1"
        }
        cd /web
        find . -type d | while IFS= read -r d; do mkdir -p "/target/$$d"; done
        find . -type f ! -path ./flutter_bootstrap.js ! -path ./sw.js ! -path ./index.html |
          while IFS= read -r f; do put "$$f"; done
        for f in ./flutter_bootstrap.js ./sw.js ./index.html; do put "$$f"; done
        cd /target
        find . ! -type d | while IFS= read -r f; do
          [ -e "/web/$$f" ] || [ "$$f" = "./$$prev" ] || rm -f "$$f"
        done
        find . -depth -type d ! -path . | while IFS= read -r d; do [ -d "/web/$$d" ] || rmdir "$$d"; done
    volumes:
      - web:/target

volumes:
  web:
