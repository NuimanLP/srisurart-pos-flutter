# Monitoring overlay (#63 `ops.1`, 07_CICD_DEPLOY.md §10, ADR-0013).
# Node Exporter (host metrics) + Prometheus + Grafana, on top of the base stack:
#
#   docker compose -f server/docker-compose.yml -f deploy/compose/monitoring.yml up -d
#
# On the VM deploy/ansible/deploy.yml composes it alongside vm.override.yml (#121, 07 §6 steps
# 2 and 6). Run by hand from /opt/pos/, it needs the config root the playbook sets:
#
#   MONITORING_CONFIG_DIR=./deploy docker compose -f docker-compose.yml -f vm.override.yml -f monitoring.yml up -d
#
# Nothing here is exposed beyond what Bull-Board already does: Prometheus and Grafana publish
# on host loopback only, reached over an SSH tunnel (server/README.md, 07 §7); node-exporter
# publishes nothing at all and is reached only over the compose network, by Prometheus.
# `server/.env` (or the VM's copy) must carry GRAFANA_ADMIN_PASSWORD — see .env.example.
#
# Memory budget (07 §5): node-exporter 64m + prometheus 512m + grafana 256m = 832m, on top of
# the base stack's ≈3.3 GB (etcd included — server/docker-compose.yml header) ≈ 4.2 GB of 6 GB.
#
# Every `image:` below is pinned `name:tag@sha256:<digest>` (#401), same policy as
# server/docker-compose.yml and Dockerfile — see the note there.

name: srisurart-pos

services:
  # Host CPU / memory / disk only — no container-level metrics are collected here, and no
  # Postgres/Redis exporter is added (out of scope, 07_CICD_DEPLOY.md §1).
  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # No `ports:` — reachable only on the compose network, scraped by `prometheus` below.

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      node-exporter: { condition: service_healthy }
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Time AND size retention (07 §5) — a service without a cap is what turns a full disk
      # into a dead POS.
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      # #251: accepts remote_write pushes from the distributed k6 shards, reached only through
      # Nginx's allowlisted + Basic-Auth-gated /prometheus-remote-write/ location (never this
      # service's own loopback port, and never a new published port — server/docker/nginx/nginx.conf).
      - "--web.enable-remote-write-receiver"
    volumes:
      # Relative paths in a Compose file resolve against the *project directory*, which
      # defaults to the directory of the FIRST `-f` file — never this file's own directory.
      # From the repo that is `server/`, so the default `../deploy` is the repo's `deploy/`.
      # On the VM the project directory is the flat `/opt/pos/`, where `../deploy` would be
      # `/opt/deploy/`; deploy.yml copies the trees to `/opt/pos/deploy/` and sets
      # MONITORING_CONFIG_DIR=./deploy (#121).
      - ${MONITORING_CONFIG_DIR:-../deploy}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      # Host loopback only, same pattern as Bull-Board — reach it via
      # `ssh -L 9090:127.0.0.1:9090 …` (server/README.md, 07 §7). Never the public interface.
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default: an unset admin password must stop the stack, exactly like the datastore
      # passwords already do (POS_APP_PASSWORD, REDIS_PASSWORD, ...) — never fall back silently.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Datasource + dashboard provider config: file-based, read-only, so a rebuilt Grafana
      # volume comes back identical with no manual step. (See the path note on `prometheus`
      # above — these resolve against the project directory, not this file's own directory.)
      - ${MONITORING_CONFIG_DIR:-../deploy}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_CONFIG_DIR:-../deploy}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own state (users, sessions) — provisioning above is independent of this.
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      # Host loopback only — reach it via `ssh -L 3000:127.0.0.1:3000 …` (07 §7).
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
