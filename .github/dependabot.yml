# sec.1 (2026-09-09) — keep the four dependency surfaces patched. Weekly, grouped, so the
# team gets at most one PR per ecosystem per week instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      server-deps:
        patterns: ['*']
    labels: [dependencies, server]

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      flutter-deps:
        patterns: ['*']
    labels: [dependencies, frontend]
    # drift / sqlite3 bumps also require re-downloading web/sqlite3.wasm and
    # web/drift_worker.js (CLAUDE.md "Web DB") — review those PRs by hand.

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, server]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
