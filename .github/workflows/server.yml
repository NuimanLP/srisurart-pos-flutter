name: Server CI

# Backend gate (#38 ci.1). Mirrors the local gate in server/README.md:
#   pnpm lint && pnpm typecheck   → job "lint"
#   pnpm test                     → job "unit"
#   migrate + pnpm test:e2e       → job "integration", on the real compose Postgres +
#                                   both Redis (their eviction policies matter), with
#                                   the real migrations applied — never synchronize.
#                                   It adds docker-compose.dev.yml, which is the only
#                                   file that publishes 5432/6379/6380 on loopback so a
#                                   runner-side test can connect (sec.1, 2026-09-09).
# Path-filtered to server/** so client-only changes skip it (ADR-0011); flutter.yml
# ignores server/** in turn. Do NOT make these jobs required checks on main until
# #39 adds an always-runs job — a server-only PR runs no Flutter jobs at all.
#
# Job "audit" (sec.1, 2026-09-09) is the CVE gate: `pnpm audit` on the lockfile plus a
# Trivy filesystem scan (lockfile + Dockerfile misconfiguration). The matching image scan
# lives in "build-image", which is the only place a built container exists (#40).
#
# Job "build-image" (#40 ci.3) is the release half: on a green build of main it builds the
# server image, scans it, smoke-runs it and uploads it as a tarball artefact. No deploy.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  # Never cancel a main run — it is the only producer of that commit's image artefact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  audit:
    name: audit (pnpm audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories. Fix by bumping, or by a `pnpm.overrides`
      # entry in package.json when the vulnerable package is transitive (see multer).
      - run: pnpm audit --audit-level=high
      - name: Trivy — lockfile CVEs + Dockerfile misconfig
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: server
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration (Postgres + both Redis, real migrations)
    runs-on: ubuntu-latest
    env:
      # Base + dev overlay for every `docker compose` call in this job. The base file
      # publishes no datastore port; only the overlay does, and only on 127.0.0.1.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # The same compose file as prod: pos_app role from the init script, allkeys-lru
      # vs noeviction+AOF, both Redis behind --requirepass. (GitHub service containers
      # cannot set a Redis command.) The dev overlay only adds the loopback ports.
      - name: write the dev secrets compose requires
        run: cp .env.example .env

      - name: start Postgres, redis-cache, redis-queue
        run: docker compose up -d --wait postgres redis-cache redis-queue

      - run: pnpm build

      - name: apply migrations as the owner role
        # A broken migration exits non-zero here and fails the build before any test runs.
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:dev-only-postgres@127.0.0.1:5432/pos

      - name: e2e (app boots as pos_app; schema suite re-runs the migrations on a scratch DB)
        run: pnpm test:e2e

      - name: compose logs
        if: failure()
        run: docker compose logs --no-color postgres redis-cache redis-queue

      - name: stop stack
        if: always()
        run: docker compose down -v

  build-image:
    name: server image artefact
    runs-on: ubuntu-latest
    needs: [lint, audit, unit, integration]
    if: github.ref == 'refs/heads/main'
    # docker build + image scan + a save/load round-trip; nothing here should take 20 min,
    # and `docker run` of the app must never be allowed to hang for the 6-hour default.
    timeout-minutes: 20
    env:
      IMAGE: srisurart-pos/server:${{ github.sha }}
    # Level 3 (#40). Runs only after every gate job above is green (an `if:` without a
    # status function implies success() over `needs`), so a red build uploads nothing.
    # There is deliberately NO deploy and NO registry push: the production host is
    # undecided until before q4 (03_ARCHITECTURE.md §8), and picking a registry is part
    # of that same decision. See server/README.md for how to consume the artefact.
    steps:
      - uses: actions/checkout@v4

      - name: docker build (tagged with the commit)
        run: docker build -t "$IMAGE" .

      - name: Trivy — CVEs in the built image
        # The other half of sec.1 (#44): `audit` scans the source tree, this scans the
        # OS packages the image actually ships, under that job's severity policy. Note
        # this can block the artefact on a fixable HIGH/CRITICAL even when every gate
        # job is green — the fix is to bump the base image, not to lower the bar here.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: smoke — every entrypoint compose runs is present, and the image starts
        # docker-compose.yml runs main.js, worker.js, bull-board.js and db/migrate.js
        # from this one image, so a build that emits only main.js must not ship.
        # Then: no datastores here (booting against them is the integration job) — with
        # no env the entrypoint executes far enough to fail its own required-env check,
        # which proves node, dist/ and the pruned node_modules are intact.
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for f in main.js worker.js bull-board.js db/migrate.js; do
              [ -f "dist/$f" ] || { echo "dist/$f is missing from the image"; exit 1; }
            done'
          if out=$(docker run --rm "$IMAGE" 2>&1); then
            echo "::error::image exited 0 with no DATABASE_URL set; expected a fast config failure"
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' <<<"$out"; then
            echo "::error::image failed to start for an unexpected reason:"
            echo "$out"
            exit 1
          fi

      - name: docker save
        run: docker save "$IMAGE" | gzip > "$RUNNER_TEMP/pos-server-$GITHUB_SHA.tar.gz"

      - name: the tarball a human downloads actually loads
        # The artefact, not the daemon's copy, is what anyone gets. Proves the round-trip
        # before it is uploaded rather than on demo day.
        run: |
          docker rmi "$IMAGE"
          docker load < "$RUNNER_TEMP/pos-server-$GITHUB_SHA.tar.gz"
          docker image inspect "$IMAGE" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: pos-server-image-${{ github.sha }}
          path: ${{ runner.temp }}/pos-server-${{ github.sha }}.tar.gz
          # Already gzipped; re-zipping compressed bytes only costs minutes.
          compression-level: 0
          retention-days: 14
