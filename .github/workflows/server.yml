name: Server CI

# Backend gate (#38 ci.1). Mirrors the local gate in server/README.md:
#   pnpm lint && pnpm typecheck   → job "lint"
#   pnpm test                     → job "unit"
#   migrate + pnpm test:e2e       → job "integration", on the real compose Postgres +
#                                   both Redis (their eviction policies matter), with
#                                   the real migrations applied — never synchronize.
#                                   It adds docker-compose.dev.yml, which is the only
#                                   file that publishes 5432/6379/6380 on loopback so a
#                                   runner-side test can connect (sec.1, 2026-09-09).
# Path-filtered to server/** so client-only changes skip it (ADR-0011); flutter.yml
# ignores server/** in turn. Do NOT make these jobs required checks on main until
# #39 adds an always-runs job — a server-only PR runs no Flutter jobs at all.
#
# Job "audit" (sec.1, 2026-09-09) is the CVE gate for the source tree: `pnpm audit` on the
# lockfile plus a Trivy filesystem scan (lockfile + Dockerfile misconfiguration). The built
# *image* is scanned in "build-image" instead, where a finding can still stop a release.
#
# Job "build-image" (#61 ci.4, extending #40) is the release half: on a green build of main
# it builds the server image, smoke-runs it, Trivy-scans it and — only then — pushes it to
# GHCR. It answers #44's open image-scan question by fixing the image (server/Dockerfile:
# base pinned by digest, `apk upgrade`, npm/npx deleted from the runtime stage) rather than
# by suppressing findings; ADR-0013 forbids a .trivyignore anywhere in this repo. No deploy.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  # Never cancel a main run — it is the only producer of that commit's image.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  audit:
    name: audit (pnpm audit + Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories. Fix by bumping, or by a `pnpm.overrides`
      # entry in package.json when the vulnerable package is transitive (see multer).
      - run: pnpm audit --audit-level=high
      - name: Trivy — lockfile CVEs + Dockerfile misconfig
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: server
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration (Postgres + both Redis, real migrations)
    runs-on: ubuntu-latest
    env:
      # Base + dev overlay for every `docker compose` call in this job. The base file
      # publishes no datastore port; only the overlay does, and only on 127.0.0.1.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # The same compose file as prod: pos_app role from the init script, allkeys-lru
      # vs noeviction+AOF, both Redis behind --requirepass. (GitHub service containers
      # cannot set a Redis command.) The dev overlay only adds the loopback ports.
      - name: write the dev secrets compose requires
        run: cp .env.example .env

      - name: start Postgres, redis-cache, redis-queue
        run: docker compose up -d --wait postgres redis-cache redis-queue

      - run: pnpm build

      - name: apply migrations as the owner role
        # A broken migration exits non-zero here and fails the build before any test runs.
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:dev-only-postgres@127.0.0.1:5432/pos

      - name: e2e (app boots as pos_app; schema suite re-runs the migrations on a scratch DB)
        run: pnpm test:e2e

      - name: compose logs
        if: failure()
        run: docker compose logs --no-color postgres redis-cache redis-queue

      - name: stop stack
        if: always()
        run: docker compose down -v

  build-image:
    name: server image → GHCR
    runs-on: ubuntu-latest
    needs: [lint, audit, unit, integration]
    if: github.ref == 'refs/heads/main'
    # docker build + a scan + a push; nothing here should take 20 min, and `docker run` of
    # the app must never be allowed to hang for the 6-hour default.
    timeout-minutes: 20
    permissions:
      # The file-level `permissions:` block above *replaces* the defaults rather than adding
      # to them, so packages would be `none` without this job-level block and the push would
      # be denied (07 §3).
      contents: read
      packages: write
    env:
      # Lowercase is mandatory in a GHCR path and `github.repository_owner` is `NuimanLP`,
      # so the owner is spelled out rather than lowercased in an extra shell step. A fork
      # would have to change this line — it cannot push into this namespace anyway.
      IMAGE: ghcr.io/nuimanlp/srisurart-pos-server
    # Level 3 (#61). Runs only after every gate job above is green (an `if:` without a status
    # function implies success() over `needs`), so a red build pushes nothing. There is still
    # NO deploy: the production host is undecided until before q4 (03_ARCHITECTURE.md §8).
    # Coordination with #39: when it lands, this job becomes a `needs:` of that workflow's
    # always-runs status job. It is never itself a required check (07 §4).
    steps:
      - uses: actions/checkout@v4

      - name: docker build (tagged with the commit)
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: smoke — every entrypoint compose runs is present, and the image starts
        # docker-compose.yml runs main.js, worker.js, bull-board.js and db/migrate.js
        # from this one image, so a build that emits only main.js must not ship. npm and
        # npx are deleted from the runtime stage, so assert they are gone from PATH and
        # from disk too (#61) — a base-image bump must not quietly put them back.
        # Then: no datastores here (booting against them is the integration job) — with
        # no env the entrypoint executes far enough to fail its own required-env check,
        # which proves node, dist/ and the pruned node_modules are intact.
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA" -c '
            for f in main.js worker.js bull-board.js db/migrate.js; do
              [ -f "dist/$f" ] || { echo "dist/$f is missing from the image"; exit 1; }
            done
            if command -v npm || command -v npx; then echo "npm/npx is back on PATH"; exit 1; fi
            if [ -n "$(ls -A /usr/local/lib/node_modules)" ]; then
              echo "/usr/local/lib/node_modules is not empty:"; ls -A /usr/local/lib/node_modules; exit 1
            fi'
          if out=$(docker run --rm "$IMAGE:$GITHUB_SHA" 2>&1); then
            echo "::error::image exited 0 with no DATABASE_URL set; expected a fast config failure"
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' <<<"$out"; then
            echo "::error::image failed to start for an unexpected reason:"
            echo "$out"
            exit 1
          fi

      - name: Trivy — image CVEs (blocks the push)
        # Deliberately before the login and the push: a fixable HIGH/CRITICAL means the
        # registry gains no tag for this commit. Fix it by bumping the base digest in
        # server/Dockerfile — never by an ignore file (ADR-0013).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push <sha> and main
        # <sha> is what a deploy pins and what a rollback names; `main` is the convenience
        # tag that always points at the newest green commit. Pushed from this public repo
        # by GITHUB_TOKEN, the package is linked to it and public from the first push —
        # verified with an anonymous pull 2026-09-10 (07 §7); no manual visibility step.
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
