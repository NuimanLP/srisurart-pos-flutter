name: Server CI

# Backend gate (#38 ci.1). Mirrors the local gate in server/README.md:
#   pnpm lint && pnpm typecheck   → job "lint"
#   pnpm test                     → job "unit"
#   migrate + pnpm test:e2e       → job "integration", on the real compose Postgres +
#                                   both Redis (their eviction policies matter), with
#                                   the real migrations applied — never synchronize.
#                                   It adds docker-compose.dev.yml, which is the only
#                                   file that publishes 5432/6379/6380 on loopback so a
#                                   runner-side test can connect (sec.1, 2026-09-09).
# Job "audit" (sec.1, 2026-09-09) is the CVE gate for the source tree: `pnpm audit` on the
# lockfile plus a Trivy filesystem scan (lockfile + Dockerfile misconfiguration). The built
# *image* is scanned in "build-image" instead, where a finding can still stop a release.
# Job "secrets" (2026-10-01) runs gitleaks over the commits each PR/push adds — repo-wide,
# never path-gated, so it lives here, feeding the always-required server-ci-status.
#
# Job "build-image" (#61 ci.4, extending #40) is the release half: on a green build of main
# it builds the server image, smoke-runs it, Trivy-scans it and — only then — pushes it to
# GHCR. It answers #44's open image-scan question by fixing the image (server/Dockerfile:
# base pinned by digest, `apk upgrade`, npm/npx deleted from the runtime stage) rather than
# by suppressing findings; ADR-0013 forbids a .trivyignore anywhere in this repo. No deploy.
#
# #39: path filtering no longer happens at the trigger level (a frontend-only PR must
# still produce a green, always-reported server-ci-status, or it can never satisfy a
# required check — CLAUDE.md "Known trap"). "lint"/"audit"/"unit" are gated per-job on the
# `changes` job instead: a PR by path, a push to `main` runs every job unless it is docs-only
# (deploy/scripts/push-changes-kind.sh). "integration" is never gated on server path (see its comment): it
# carries the cross-tenant isolation tests in test/security.e2e-spec.ts, which run on
# every PR regardless of what changed.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed by SHA on main so two quick merges each keep their own run (and their own
  # release image) rather than the second evicting the first's in-progress run.
  group: server-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a main run — it is the only producer of that commit's image.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  changes:
    name: detect changed paths (pull_request + push)
    runs-on: ubuntu-latest
    # PR: dorny/paths-filter. Push to main: deploy/scripts/push-changes-kind.sh over
    # before..sha — a docs-only push skips the test/image jobs (no image, so no Deploy waiting
    # for approval). workflow_dispatch never filters: this job is skipped and everything runs.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      # dorny/paths-filter on a pull_request event calls the PR-files API, which
      # needs this beyond the file-level `contents: read`.
      pull-requests: read
    outputs:
      # Exactly one of the two steps runs per event; the other's output is ''.
      server: ${{ steps.filter.outputs.server || steps.push.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # push: the before..sha range must be present.
          # 0 is falsy in expressions (`&& 0 || 1` always gave 1 → classifier saw no `before`, PR #547); use a string.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - name: classify the pushed commits (docs-only vs code)
        id: push
        if: github.event_name == 'push'
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: deploy/scripts/push-changes-kind.sh
      - uses: dorny/paths-filter@v4
        id: filter
        # PR only — on a push its 'false' string would win the `||` below over the push step.
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/server.yml'
              # backup-db.sh + its test run in the nginx-check job (deploy-script checks).
              - 'deploy/scripts/backup-db.sh'
              - 'deploy/scripts/test/**'
              # #185: test/synthetic-snapshot.spec.ts pins this committed sample to the generator.
              - 'frontend/test/fixtures/synthetic_snapshot_*.json'

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `changes`: a secret can land in any path, so this runs on
    # every PR/push and server-ci-status (required on main) demands `success` from it —
    # `skipped` does not count. Scans only the commits being added (PR: base..head; push:
    # before..sha), so history reviewed once (2026-10-01) is not re-flagged. Allowlists:
    # .gitleaks.toml (placeholder patterns) + .gitleaksignore (reviewed fingerprints), read
    # from the PR's base commit on pull_request (see the scan step).
    # Pinned release binary + sha256 instead of gitleaks-action (org licence key, and a
    # third-party action would see the checkout). Bump both env values together.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the PR base and the push `before` commit must both be present.
          fetch-depth: 0
      - name: install gitleaks (pinned, sha256-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: scan the commits this event adds (--redact; exit 1 on any finding)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            range="$PR_BASE..$PR_HEAD"
            # Allowlists come from the BASE commit, never from the PR itself — otherwise a PR
            # could allowlist its own secret. An allowlist edit takes effect once merged.
            trusted="$PR_BASE"
          else
            trusted="$GITHUB_SHA"
            if [[ "$EVENT" == "push" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] \
                 && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$GITHUB_SHA"
            else
              # workflow_dispatch, or a push whose `before` is zero/unknown: full history.
              range="$GITHUB_SHA"
            fi
          fi
          gl="$RUNNER_TEMP/gl"
          mkdir -p "$gl"
          cfg="$gl/gitleaks.toml"
          ign="$gl/.gitleaksignore"
          # Absent on the trusted commit → default rules only / no ignored fingerprints.
          # Any other git error (bad sha, unreadable object) fails the job under `bash -e`.
          git cat-file -e "$trusted^{commit}"
          if git cat-file -e "$trusted:.gitleaks.toml" 2>/dev/null; then
            git show "$trusted:.gitleaks.toml" > "$cfg"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg"
          fi
          if git cat-file -e "$trusted:.gitleaksignore" 2>/dev/null; then
            git show "$trusted:.gitleaksignore" > "$ign"
          else
            : > "$ign"
          fi
          # gitleaks ALSO reads <source>/.gitleaksignore on top of --gitleaks-ignore-path, so
          # the PR's own copies must leave the working tree (history is read from objects).
          rm -f .gitleaks.toml .gitleaksignore
          echo "scanning: $range (allowlists from $trusted)"
          # -v + --redact: a failure names file/line/rule/fingerprint with the value masked.
          # --ignore-gitleaks-allow: an inline `gitleaks:allow` comment cannot silence a hit.
          "$RUNNER_TEMP/gitleaks" git -v --redact --no-banner --no-color --exit-code 1 \
            --ignore-gitleaks-allow --config "$cfg" --gitleaks-ignore-path "$gl" \
            --log-opts="$range" .

  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  audit:
    name: audit (pnpm audit + Trivy fs)
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories. Fix by bumping, or by a `pnpm.overrides`
      # entry in package.json when the vulnerable package is transitive (see multer).
      - run: pnpm audit --audit-level=high
      - name: Trivy — lockfile CVEs + Dockerfile misconfig
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: server
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  nginx-check:
    name: nginx config check (nginx -t)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true') }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      # The real certgen script (CA + server cert + ca.crt), so both configs below are tested
      # against exactly the file names it writes.
      - name: generate test TLS certs (certgen.sh) and htpasswd for syntax validation
        run: |
          mkdir -p .tmp-nginx/certs .tmp-nginx/ca .tmp-nginx/auth
          CERTS_DIR=.tmp-nginx/certs CA_DIR=.tmp-nginx/ca sh server/docker/certgen/certgen.sh
          printf 'dummy:%s\n' "$(openssl passwd -apr1 dummy)" > .tmp-nginx/auth/k6-remote-write.htpasswd
      - name: test nginx configuration (nginx -t)
        run: |
          docker run --rm \
            -v "$PWD/server/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/.tmp-nginx/certs:/etc/nginx/certs:ro" \
            -v "$PWD/.tmp-nginx/auth:/etc/nginx/auth:ro" \
            nginx:1.29-alpine nginx -t
      # #443 PR4: the platform-ui dashboard is also nginx, and its config needs `proxy_ssl_trusted_
      # certificate` (a real, readable PEM) to test clean — reuse the throwaway ca.crt above.
      - name: test platform-ui nginx configuration (nginx -t)
        run: |
          docker run --rm \
            -v "$PWD/server/docker/platform-ui/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/server/docker/platform-ui/html:/usr/share/nginx/html:ro" \
            -v "$PWD/.tmp-nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.29-alpine nginx -t
      # certgen: fresh volume, idempotent re-run, and the upgrade off the old self-signed cert.
      - name: certgen.sh tests
        run: deploy/scripts/test/certgen.test.sh
      # Deploy-script check: a failed pg_dump must not leave a pos_backup_*.sql.gz behind.
      - name: backup-db.sh tests (stubbed pg_dump)
        run: deploy/scripts/test/backup-db.test.sh
      - name: cleanup temporary files
        if: always()
        run: rm -rf .tmp-nginx

  integration:
    name: integration (Postgres + both Redis, real migrations)
    runs-on: ubuntu-latest
    needs: [changes]
    # #39: deliberately NOT gated on the *server path filter* — this job's `pnpm test:e2e` run
    # includes the cross-tenant isolation tests (test/security.e2e-spec.ts,
    # "denies cross-tenant read access" / "denies cross-tenant void" / "ignores
    # tenantId in request body"), which the sixth multi-tenant rule requires on
    # every PR regardless of which paths it touches (07_CICD_DEPLOY.md §2, rule 3).
    # The only skip is a docs-only push to main (see `changes`): it builds no image either.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.changes.outputs.server == 'true') }}
    env:
      # Base + dev overlay for every `docker compose` call in this job. The base file
      # publishes no datastore port; only the overlay does, and only on 127.0.0.1.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # The same compose file as prod: pos_app role from the init script, allkeys-lru
      # vs noeviction+AOF, both Redis behind --requirepass. (GitHub service containers
      # cannot set a Redis command.) The dev overlay only adds the loopback ports.
      - name: write the dev secrets compose requires
        run: cp .env.example .env

      - name: start Postgres, redis-cache, redis-queue
        run: docker compose up -d --wait postgres redis-cache redis-queue

      - run: pnpm build

      - name: apply migrations as the owner role
        # A broken migration exits non-zero here and fails the build before any test runs.
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:dev-only-postgres@127.0.0.1:5432/pos

      - name: e2e (app boots as pos_app; schema suite re-runs the migrations on a scratch DB)
        run: pnpm test:e2e

      - name: compose logs
        if: failure()
        run: docker compose logs --no-color postgres redis-cache redis-queue

      - name: stop stack
        if: always()
        run: docker compose down -v

  build-image:
    name: server image → GHCR
    runs-on: ubuntu-latest
    needs: [secrets, lint, audit, unit, integration, nginx-check]
    # The explicit results matter: with a bare `if:` GitHub applies an implicit success(), which
    # also requires every *ancestor* to have succeeded — and `changes` is always skipped on push,
    # so this job was skipped on every `main` push from #39 until #184 found no image to deploy.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.secrets.result == 'success' && needs.lint.result == 'success' && needs.audit.result == 'success' && needs.unit.result == 'success' && needs.integration.result == 'success' && needs.nginx-check.result == 'success' }}
    # docker build + a scan + a push; nothing here should take 20 min, and `docker run` of
    # the app must never be allowed to hang for the 6-hour default.
    timeout-minutes: 20
    permissions:
      # The file-level `permissions:` block above *replaces* the defaults rather than adding
      # to them, so packages would be `none` without this job-level block and the push would
      # be denied (07 §3).
      contents: read
      packages: write
    env:
      # Lowercase is mandatory in a GHCR path and `github.repository_owner` is `NuimanLP`,
      # so the owner is spelled out rather than lowercased in an extra shell step. A fork
      # would have to change this line — it cannot push into this namespace anyway.
      IMAGE: ghcr.io/nuimanlp/srisurart-pos-server
    # Level 3 (#61). Runs only after every gate job above is green (an `if:` without a status
    # function implies success() over `needs`), so a red build pushes nothing. There is still
    # NO deploy: the production host is undecided until before q4 (03_ARCHITECTURE.md §8).
    # #39: this job is a `needs:` of server-ci-status below; it is never itself a required
    # check (07 §4).
    steps:
      - uses: actions/checkout@v5

      - name: docker build (tagged with the commit)
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: smoke — every entrypoint compose runs is present, and the image starts
        # docker-compose.yml runs main.js, worker.js, bull-board.js and db/migrate.js
        # from this one image, so a build that emits only main.js must not ship. npm and
        # npx are deleted from the runtime stage, so assert they are gone from PATH and
        # from disk too (#61) — a base-image bump must not quietly put them back.
        # Then: no datastores here (booting against them is the integration job) — with
        # no env the entrypoint executes far enough to fail its own required-env check,
        # which proves node, dist/ and the pruned node_modules are intact.
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA" -c '
            for f in main.js worker.js bull-board.js db/migrate.js; do
              [ -f "dist/$f" ] || { echo "dist/$f is missing from the image"; exit 1; }
            done
            if command -v npm || command -v npx; then echo "npm/npx is back on PATH"; exit 1; fi
            if [ -n "$(ls -A /usr/local/lib/node_modules)" ]; then
              echo "/usr/local/lib/node_modules is not empty:"; ls -A /usr/local/lib/node_modules; exit 1
            fi'
          if out=$(docker run --rm "$IMAGE:$GITHUB_SHA" 2>&1); then
            echo "::error::image exited 0 with no DATABASE_URL set; expected a fast config failure"
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' <<<"$out"; then
            echo "::error::image failed to start for an unexpected reason:"
            echo "$out"
            exit 1
          fi

      - name: Trivy — image CVEs (blocks the push)
        # Deliberately before the login and the push: a fixable HIGH/CRITICAL means the
        # registry gains no tag for this commit. Fix it by bumping the base digest in
        # server/Dockerfile — never by an ignore file (ADR-0013).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push <sha> and main
        # <sha> is what a deploy pins and what a rollback names; `main` is the convenience
        # tag that always points at the newest green commit. Pushed from this public repo
        # by GITHUB_TOKEN, the package is linked to it and public from the first push —
        # verified with an anonymous pull 2026-09-10 (07 §7); no manual visibility step.
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

  server-ci-status:
    name: server-ci-status
    runs-on: ubuntu-latest
    needs: [changes, secrets, lint, audit, unit, integration, build-image, nginx-check]
    # #39: this is the only server-side required check on `main`. It must report
    # on every PR — including a frontend-only one, where "lint"/"audit"/"unit"
    # (and `changes` itself, on push/workflow_dispatch) are legitimately skipped
    # — so this uses `always()` to run unconditionally rather than `!cancelled()`,
    # which would let GitHub skip *this* job too when the whole run is cancelled;
    # a skipped required check is treated as passing, which is the false green
    # 07_CICD_DEPLOY.md §2 rule 4 warns about. `always()` is safe here only
    # because the result loop below explicitly fails on "cancelled" (and any
    # other non-success/non-skipped result) for every job in `needs` — bare
    # `always()` with no such check would itself be a false green.
    if: always()
    # No checkout here, so `server/` doesn't exist — override the workflow-level
    # working-directory or bash can't even start.
    defaults:
      run:
        working-directory: .
    steps:
      - name: require every job above to have succeeded or been skipped
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.unit.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.build-image.result }}" \
            "${{ needs.nginx-check.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::a required server job did not succeed: $result"
              exit 1
            fi
          done
          # The secret scan is never path-gated, so `skipped` here is not a pass.
          if [[ "${{ needs.secrets.result }}" != "success" ]]; then
            echo "::error::secret scan (gitleaks) did not succeed: ${{ needs.secrets.result }}"
            exit 1
          fi
          # On a push, `changes` must have classified it (true = code, false = docs only).
          if [[ "${{ github.event_name }}" == "push" && "${{ needs.changes.outputs.server }}" != "true" && "${{ needs.changes.outputs.server }}" != "false" ]]; then
            echo "::error::push was not classified by the changes job: '${{ needs.changes.outputs.server }}'"
            exit 1
          fi
          # A skipped release image on a `main` push of CODE is not a pass: that is how #39's skip
          # went unnoticed for every release (#184). A docs-only push (changes=false) builds none.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "${{ needs.changes.outputs.server }}" == "true" && "${{ needs.build-image.result }}" != "success" ]]; then
            echo "::error::build-image did not run on a main push: ${{ needs.build-image.result }}"
            exit 1
          fi
