name: Flutter CI

# Client-side gate. Mirrors the local gate in CLAUDE.md:
#   dart analyze  (NEVER flutter analyze — see the non-ASCII path constraint)
#   flutter test
# server/ has its own workflow. #39: path filtering no longer happens at the
# trigger level (a server-only PR must still produce a green, always-reported
# flutter-ci-status, or it can never satisfy a required check — CLAUDE.md
# "Known trap"). Filtering instead happens per-job below, keyed off the
# `changes` job, and only on pull_request — a push to `main` always runs
# every job so every commit on main produces both release images
# (07_CICD_DEPLOY.md §2).

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed by SHA on main so two quick merges each keep their own run (and their own
  # release images) rather than the second evicting the first's in-progress run.
  group: flutter-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a main run — it is the only producer of that commit's web artefact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.44.3'   # keep in sync with frontend/.fvmrc
  WEB_IMAGE: ghcr.io/nuimanlp/srisurart-pos-web

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: detect changed paths (pull_request only)
    runs-on: ubuntu-latest
    # Push and workflow_dispatch never filter (see the header comment), so this
    # job — and the path check it feeds — only needs to run for a PR.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # dorny/paths-filter on a pull_request event calls the PR-files API, which
      # needs this beyond the file-level `contents: read`.
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/flutter.yml'

  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides, on both push and pull_request.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: check web DB asset versions match pubspec.lock
        # #245: web/sqlite3.wasm and web/drift_worker.js are downloaded from a specific
        # simolus3 release tag (see web/WEB_DB_ASSET_VERSIONS.txt) and a version skew
        # against the locked sqlite3/drift packages breaks the web DB at boot with no
        # error until the app is opened (CLAUDE.md "Web DB").
        run: |
          # Reads the version field from inside a top-level `  <name>:` block only
          # (stops at the next top-level key), so it can't bleed into a neighbouring
          # package if fields are ever added/reordered.
          locked_version() {
            awk -v key="  $1:" '
              $0 == key { found=1; next }
              found && /^  [A-Za-z0-9_]+:$/ { exit }
              found && /^    version:/ { print; exit }
            ' pubspec.lock | sed -E 's/.*"([0-9.]+)".*/\1/'
          }
          locked_sqlite3=$(locked_version sqlite3)
          locked_drift=$(locked_version drift)
          asset_sqlite3=$(grep '^sqlite3=' web/WEB_DB_ASSET_VERSIONS.txt | cut -d= -f2)
          asset_drift=$(grep '^drift=' web/WEB_DB_ASSET_VERSIONS.txt | cut -d= -f2)
          if [[ -z "$locked_sqlite3" || -z "$locked_drift" || -z "$asset_sqlite3" || -z "$asset_drift" ]]; then
            echo "::error::could not parse a version (pubspec.lock sqlite3='$locked_sqlite3' drift='$locked_drift', WEB_DB_ASSET_VERSIONS.txt sqlite3='$asset_sqlite3' drift='$asset_drift') — pubspec.lock's format may have changed."
            exit 1
          fi
          echo "pubspec.lock: sqlite3=$locked_sqlite3 drift=$locked_drift"
          echo "web/WEB_DB_ASSET_VERSIONS.txt: sqlite3=$asset_sqlite3 drift=$asset_drift"
          if [[ "$locked_sqlite3" != "$asset_sqlite3" || "$locked_drift" != "$asset_drift" ]]; then
            echo "::error::pubspec.lock (sqlite3=$locked_sqlite3, drift=$locked_drift) no longer matches the committed web DB assets (sqlite3=$asset_sqlite3, drift=$asset_drift, per web/WEB_DB_ASSET_VERSIONS.txt). Re-download web/sqlite3.wasm and web/drift_worker.js from the matching github.com/simolus3/{sqlite3.dart,drift} release tags, update WEB_DB_ASSET_VERSIONS.txt, and update CLAUDE.md."
            exit 1
          fi

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

  deps-audit:
    name: pubspec.lock CVEs (OSV-Scanner)
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides, on both push and pull_request.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    # sec.1 (2026-09-09): `pub` has no `audit` command, so the lockfile is checked
    # against OSV. Fails on any known vulnerability in a locked dependency.
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=frontend/pubspec.lock

  codegen-check:
    name: drift codegen is up to date
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides, on both push and pull_request.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    # The committed *.g.dart files are the build on the shop's Thai path, where
    # build_runner cannot run (CLAUDE.md). CI runners are ASCII, so this is the
    # only place the generated code is ever verified against the schema.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: fail if generated code differs from what is committed
        run: |
          if ! git diff --quiet -- '*.g.dart'; then
            echo "::error::Generated Drift code is stale. Run 'dart run build_runner build' on an ASCII path and commit the result."
            git diff --stat -- '*.g.dart'
            exit 1
          fi

  build-web:
    name: build web artifact
    runs-on: ubuntu-latest
    needs: [analyze-and-test, codegen-check, deps-audit]
    # The explicit results matter: with a bare `if:` GitHub applies an implicit success(), which
    # also requires every *ancestor* to have succeeded — and `changes` is always skipped on push,
    # so this job was skipped on every `main` push from #39 until #184 found no image to deploy.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.analyze-and-test.result == 'success' && needs.codegen-check.result == 'success' && needs.deps-audit.result == 'success' }}
    # Level 3 (CLAUDE.md): the artifact is produced on every green build, and
    # ci.5 (#62) adds the web image — static files only, same <sha>/main tag
    # discipline as the server image (07_CICD_DEPLOY.md §3). The downloadable
    # artefact stays: it is how a person inspects a build without a registry.
    # There is deliberately NO deploy step — the production host is undecided
    # until before task q4 (03_ARCHITECTURE.md §8). The faculty VM is demo-only.
    # #39: this job is a `needs:` of flutter-ci-status below; it is never
    # itself a required check (07 §4).
    # Visibility: a package first pushed by GITHUB_TOKEN from this public repo is
    # linked to it and is public from the start — verified 2026-09-10 with an
    # anonymous pull of both images right after the first push (07 §7). No manual
    # flip is needed; check again only if the repo ever goes private.
    permissions:
      contents: read
      # The file-level `permissions:` replaces the default set, so packages
      # would otherwise be none here.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build web
        run: flutter build web --no-tree-shake-icons

      - name: check web DB assets shipped
        # A version skew between these and the drift/sqlite3 pub versions breaks
        # the web DB at boot with no error until the app is opened (CLAUDE.md).
        run: |
          test -f build/web/sqlite3.wasm || { echo "::error::sqlite3.wasm missing from build/web"; exit 1; }
          test -f build/web/drift_worker.js || { echo "::error::drift_worker.js missing from build/web"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pos-web-${{ github.sha }}
          path: frontend/build/web
          retention-days: 14

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build web image
        # Context is frontend/ (the job's working-directory) so the Dockerfile's
        # COPY sees build/web; the Dockerfile itself lives in deploy/.
        run: |
          docker build -f ../deploy/web.Dockerfile \
            -t "$WEB_IMAGE:${{ github.sha }}" \
            -t "$WEB_IMAGE:main" .

      - name: smoke test the web image
        # The image must be exactly the build output: the entry point, both web
        # DB assets, no nginx, and nothing configured to serve (no EXPOSE, the
        # base's default CMD). Nginx on the VM is stock; this image is inert.
        run: |
          docker run --rm "$WEB_IMAGE:${{ github.sha }}" sh -c '
            test -f /web/index.html &&
            test -f /web/sqlite3.wasm &&
            test -f /web/drift_worker.js &&
            ! command -v nginx
          ' || { echo "::error::web image contents are wrong"; exit 1; }
          [ "$(docker image inspect "$WEB_IMAGE:${{ github.sha }}" --format '{{len .Config.ExposedPorts}}')" = 0 ] \
            || { echo "::error::web image exposes a port"; exit 1; }

      - name: push web image
        run: |
          docker push "$WEB_IMAGE:${{ github.sha }}"
          docker push "$WEB_IMAGE:main"

  flutter-ci-status:
    name: flutter-ci-status
    runs-on: ubuntu-latest
    needs: [changes, analyze-and-test, deps-audit, codegen-check, build-web]
    # #39: this is the only Flutter-side required check on `main`. It must report
    # on every PR — including a server-only one, where every job above (and
    # `changes` itself, on push/workflow_dispatch) is legitimately skipped — so
    # this uses `always()` to run unconditionally rather than `!cancelled()`,
    # which would let GitHub skip *this* job too when the whole run is cancelled;
    # a skipped required check is treated as passing, which is the false green
    # 07_CICD_DEPLOY.md §2 rule 4 warns about. `always()` is safe here only
    # because the result loop below explicitly fails on "cancelled" (and any
    # other non-success/non-skipped result) for every job in `needs` — bare
    # `always()` with no such check would itself be a false green.
    if: always()
    # No checkout here, so `frontend/` doesn't exist — override the workflow-level
    # working-directory or bash can't even start.
    defaults:
      run:
        working-directory: .
    steps:
      - name: require every job above to have succeeded or been skipped
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.analyze-and-test.result }}" \
            "${{ needs.deps-audit.result }}" \
            "${{ needs.codegen-check.result }}" \
            "${{ needs.build-web.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::a required Flutter job did not succeed: $result"
              exit 1
            fi
          done
          # A skipped release image on a `main` push is not a pass: that is how #39's skip went
          # unnoticed for every release (#184).
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "${{ needs.build-web.result }}" != "success" ]]; then
            echo "::error::build-web did not run on a main push: ${{ needs.build-web.result }}"
            exit 1
          fi
