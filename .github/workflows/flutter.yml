name: Flutter CI

# Client-side gate. Mirrors the local gate in CLAUDE.md:
#   dart analyze  (NEVER flutter analyze — see the non-ASCII path constraint)
#   flutter test
# server/ has its own workflow; paths-ignore keeps this from running on
# backend-only changes (ADR-0011).

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  # Never cancel a main run — it is the only producer of that commit's web artefact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.44.3'   # keep in sync with frontend/.fvmrc
  WEB_IMAGE: ghcr.io/nuimanlp/srisurart-pos-web

defaults:
  run:
    working-directory: frontend

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

  deps-audit:
    name: pubspec.lock CVEs (OSV-Scanner)
    runs-on: ubuntu-latest
    # sec.1 (2026-09-09): `pub` has no `audit` command, so the lockfile is checked
    # against OSV. Fails on any known vulnerability in a locked dependency.
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=frontend/pubspec.lock

  codegen-check:
    name: drift codegen is up to date
    runs-on: ubuntu-latest
    # The committed *.g.dart files are the build on the shop's Thai path, where
    # build_runner cannot run (CLAUDE.md). CI runners are ASCII, so this is the
    # only place the generated code is ever verified against the schema.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: fail if generated code differs from what is committed
        run: |
          if ! git diff --quiet -- '*.g.dart'; then
            echo "::error::Generated Drift code is stale. Run 'dart run build_runner build' on an ASCII path and commit the result."
            git diff --stat -- '*.g.dart'
            exit 1
          fi

  build-web:
    name: build web artifact
    runs-on: ubuntu-latest
    needs: [analyze-and-test, codegen-check, deps-audit]
    if: github.ref == 'refs/heads/main'
    # Level 3 (CLAUDE.md): the artifact is produced on every green build, and
    # ci.5 (#62) adds the web image — static files only, same <sha>/main tag
    # discipline as the server image (07_CICD_DEPLOY.md §3). The downloadable
    # artefact stays: it is how a person inspects a build without a registry.
    # There is deliberately NO deploy step — the production host is undecided
    # until before task q4 (03_ARCHITECTURE.md §8). The faculty VM is demo-only.
    # When #39 lands, this job becomes a `needs:` of the flutter-ci-status job;
    # it is never itself a required check (07 §4).
    # 🔴 One-time manual step after the first push: both GHCR packages
    # (srisurart-pos-server and srisurart-pos-web) are created private by
    # GITHUB_TOKEN and must be flipped to public by hand — runbook 07 §7.
    permissions:
      contents: read
      # The file-level `permissions:` replaces the default set, so packages
      # would otherwise be none here.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build web
        run: flutter build web --no-tree-shake-icons

      - name: check web DB assets shipped
        # A version skew between these and the drift/sqlite3 pub versions breaks
        # the web DB at boot with no error until the app is opened (CLAUDE.md).
        run: |
          test -f build/web/sqlite3.wasm || { echo "::error::sqlite3.wasm missing from build/web"; exit 1; }
          test -f build/web/drift_worker.js || { echo "::error::drift_worker.js missing from build/web"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pos-web-${{ github.sha }}
          path: frontend/build/web
          retention-days: 14

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build web image
        # Context is frontend/ (the job's working-directory) so the Dockerfile's
        # COPY sees build/web; the Dockerfile itself lives in deploy/.
        run: |
          docker build -f ../deploy/web.Dockerfile \
            -t "$WEB_IMAGE:${{ github.sha }}" \
            -t "$WEB_IMAGE:main" .

      - name: smoke test the web image
        # The image must be exactly the build output: the entry point, both web
        # DB assets, no nginx, and nothing configured to serve (no EXPOSE, the
        # base's default CMD). Nginx on the VM is stock; this image is inert.
        run: |
          docker run --rm "$WEB_IMAGE:${{ github.sha }}" sh -c '
            test -f /web/index.html &&
            test -f /web/sqlite3.wasm &&
            test -f /web/drift_worker.js &&
            ! command -v nginx
          ' || { echo "::error::web image contents are wrong"; exit 1; }
          [ "$(docker image inspect "$WEB_IMAGE:${{ github.sha }}" --format '{{len .Config.ExposedPorts}}')" = 0 ] \
            || { echo "::error::web image exposes a port"; exit 1; }

      - name: push web image
        run: |
          docker push "$WEB_IMAGE:${{ github.sha }}"
          docker push "$WEB_IMAGE:main"
