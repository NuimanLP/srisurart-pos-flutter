name: Flutter CI

# Client-side gate. Mirrors the local gate in CLAUDE.md:
#   dart analyze  (NEVER flutter analyze — see the non-ASCII path constraint)
#   flutter test
# server/ has its own workflow. #39: path filtering no longer happens at the
# trigger level (a server-only PR must still produce a green, always-reported
# flutter-ci-status, or it can never satisfy a required check — CLAUDE.md
# "Known trap"). Filtering instead happens per-job below, keyed off the
# `changes` job. A PR is filtered by path; a push to `main` or `develop` runs every job unless it
# is docs-only (deploy/scripts/push-changes-kind.sh), so every CODE commit on main produces both
# release images and every code commit on develop gets a full test result (07_CICD_DEPLOY.md §2).
# build-web (the GHCR push) never runs on a develop push.

permissions:
  contents: read

on:
  push:
    # develop (2026-10-07): every push gets a full CI result too, because two PRs green alone can
    # be red together. A push publishes to GHCR only from main: build-web is gated on
    # refs/heads/main (or a manual workflow_dispatch, which pushes only a web <sha> tag and is never
    # deployable — no server image), and deploy.yml only reacts to main.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed by ref + SHA on main/develop so two quick merges each keep their own run (and, on main,
  # their own release images) rather than the second evicting the first's in-progress run. On
  # develop a cancelled run would also turn its always()-run status job red on that commit.
  group: flutter-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && format('-{0}', github.sha) || '' }}
  # Never cancel a main run (the only producer of that commit's web artefact) or a develop run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  FLUTTER_VERSION: '3.44.3'   # keep in sync with frontend/.fvmrc
  WEB_IMAGE: ghcr.io/nuimanlp/srisurart-pos-web

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: detect changed paths (pull_request + push)
    runs-on: ubuntu-latest
    # PR: dorny/paths-filter. Push to main/develop: deploy/scripts/push-changes-kind.sh over
    # before..sha — a docs-only push skips the test/image jobs (on main: no image, so no Deploy
    # waiting for approval). workflow_dispatch never filters: this job is skipped and everything runs.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      # dorny/paths-filter on a pull_request event calls the PR-files API, which
      # needs this beyond the file-level `contents: read`.
      pull-requests: read
    outputs:
      # Exactly one of the two steps runs per event; the other's output is ''.
      frontend: ${{ steps.filter.outputs.frontend || steps.push.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # push: the before..sha range must be present.
          # 0 is falsy in expressions (`&& 0 || 1` always gave 1 → classifier saw no `before`, PR #547); use a string.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - name: classify the pushed commits (docs-only vs code)
        id: push
        if: github.event_name == 'push'
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: deploy/scripts/push-changes-kind.sh
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        # PR only — on a push its 'false' string would win the `||` below over the push step.
        if: github.event_name == 'pull_request'
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/flutter.yml'
              # Client-request fixtures the Flutter tests read (PR #581).
              - 'docs/Backend_design/fixtures/client-requests/**'
              # build-web builds + Trivy-scans the web image on a PR too.
              - 'deploy/web.Dockerfile'

  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: check web DB asset versions match pubspec.lock
        # #245: web/sqlite3.wasm and web/drift_worker.js are downloaded from a specific
        # simolus3 release tag (see web/WEB_DB_ASSET_VERSIONS.txt) and a version skew
        # against the locked sqlite3/drift packages breaks the web DB at boot with no
        # error until the app is opened (CLAUDE.md "Web DB").
        run: |
          # Reads the version field from inside a top-level `  <name>:` block only
          # (stops at the next top-level key), so it can't bleed into a neighbouring
          # package if fields are ever added/reordered.
          locked_version() {
            awk -v key="  $1:" '
              $0 == key { found=1; next }
              found && /^  [A-Za-z0-9_]+:$/ { exit }
              found && /^    version:/ { print; exit }
            ' pubspec.lock | sed -E 's/.*"([0-9.]+)".*/\1/'
          }
          locked_sqlite3=$(locked_version sqlite3)
          locked_drift=$(locked_version drift)
          asset_sqlite3=$(grep '^sqlite3=' web/WEB_DB_ASSET_VERSIONS.txt | cut -d= -f2)
          asset_drift=$(grep '^drift=' web/WEB_DB_ASSET_VERSIONS.txt | cut -d= -f2)
          if [[ -z "$locked_sqlite3" || -z "$locked_drift" || -z "$asset_sqlite3" || -z "$asset_drift" ]]; then
            echo "::error::could not parse a version (pubspec.lock sqlite3='$locked_sqlite3' drift='$locked_drift', WEB_DB_ASSET_VERSIONS.txt sqlite3='$asset_sqlite3' drift='$asset_drift') — pubspec.lock's format may have changed."
            exit 1
          fi
          echo "pubspec.lock: sqlite3=$locked_sqlite3 drift=$locked_drift"
          echo "web/WEB_DB_ASSET_VERSIONS.txt: sqlite3=$asset_sqlite3 drift=$asset_drift"
          if [[ "$locked_sqlite3" != "$asset_sqlite3" || "$locked_drift" != "$asset_drift" ]]; then
            echo "::error::pubspec.lock (sqlite3=$locked_sqlite3, drift=$locked_drift) no longer matches the committed web DB assets (sqlite3=$asset_sqlite3, drift=$asset_drift, per web/WEB_DB_ASSET_VERSIONS.txt). Re-download web/sqlite3.wasm and web/drift_worker.js from the matching github.com/simolus3/{sqlite3.dart,drift} release tags, update WEB_DB_ASSET_VERSIONS.txt, and update CLAUDE.md."
            exit 1
          fi

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: flutter test (with coverage)
        # Includes test/silent_failure_guard_test.dart (an awaited repository
        # write with no surfacing catch fails the build).
        run: flutter test --reporter expanded --coverage

      - name: coverage ratchet
        # Fails below the integer baseline in frontend/coverage_baseline.txt;
        # prints the percentage to the job summary. *.g.dart is excluded.
        run: bash tool/coverage_check.sh coverage/lcov.info coverage_baseline.txt

      - name: upload lcov.info
        if: ${{ !cancelled() && hashFiles('frontend/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: flutter-lcov-${{ github.sha }}
          path: frontend/coverage/lcov.info
          retention-days: 14

  deps-audit:
    name: pubspec.lock CVEs (OSV-Scanner)
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    # sec.1 (2026-09-09): `pub` has no `audit` command, so the lockfile is checked
    # against OSV. Fails on any known vulnerability in a locked dependency.
    steps:
      - uses: actions/checkout@v5
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=frontend/pubspec.lock

  codegen-check:
    name: drift codegen is up to date
    runs-on: ubuntu-latest
    needs: [changes]
    # `needs: [changes]` on its own would implicitly require `changes` to have
    # *succeeded*; on push/workflow_dispatch it is skipped by its own `if:` above,
    # which would cascade to skip this job too. `!cancelled()` overrides that
    # implicit requirement so the second clause (the actual path gate) is what
    # decides (workflow_dispatch always runs).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    # The committed *.g.dart files are the build on the shop's Thai path, where
    # build_runner cannot run (CLAUDE.md). CI runners are ASCII, so this is the
    # only place the generated code is ever verified against the schema.
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: fail if generated code differs from what is committed
        run: |
          if ! git diff --quiet -- '*.g.dart'; then
            echo "::error::Generated Drift code is stale. Run 'dart run build_runner build' on an ASCII path and commit the result."
            git diff --stat -- '*.g.dart'
            exit 1
          fi

  build-web:
    name: build web artifact
    runs-on: ubuntu-latest
    needs: [analyze-and-test, codegen-check, deps-audit]
    # The explicit results matter: with a bare `if:` GitHub applies an implicit success(), which
    # also requires every *ancestor* to have succeeded — and `changes` is always skipped on push,
    # so this job was skipped on every `main` push from #39 until #184 found no image to deploy.
    # A manual branch run is the pre-merge proof path for changes to this image:
    # it publishes only the immutable SHA tag below, never the moving main tag.
    # On a pull_request (that touched frontend/ or web.Dockerfile) it runs too, build-only: the web
    # build, the image, its smoke test and the Trivy image scan gate the PR; the artefact upload,
    # GHCR login and push are skipped (same shape as server.yml's build-image legs).
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && needs.analyze-and-test.result == 'success' && needs.codegen-check.result == 'success' && needs.deps-audit.result == 'success' }}
    # Level 3 (CLAUDE.md): the artifact is produced on every green build, and
    # ci.5 (#62) adds the web image — static files only, same <sha>/main tag
    # discipline as the server image (07_CICD_DEPLOY.md §3). The downloadable
    # artefact stays: it is how a person inspects a build without a registry.
    # There is deliberately NO deploy step — the production host is undecided
    # until before task q4 (03_ARCHITECTURE.md §8). The faculty VM is demo-only.
    # #39: this job is a `needs:` of flutter-ci-status below; it is never
    # itself a required check (07 §4).
    # Visibility: a package first pushed by GITHUB_TOKEN from this public repo is
    # linked to it and is public from the start — verified 2026-09-10 with an
    # anonymous pull of both images right after the first push (07 §7). No manual
    # flip is needed; check again only if the repo ever goes private.
    permissions:
      contents: read
      # The file-level `permissions:` replaces the default set, so packages
      # would otherwise be none here.
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # On a PR this job runs PR code with packages: write; nothing here needs the token in
          # .git/config (same as server.yml build-image).
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build web
        run: >-
          flutter build web --no-tree-shake-icons
          --dart-define=USE_API_WRITES=true
          --dart-define=API_BASE_URL=

      - name: version the entry point
        # main.dart.js → main.<sha12>.dart.js, rewritten in flutter_bootstrap.js and sw.js, so a
        # page load spanning a web-sync swap never runs one release's bootstrap against the
        # other's main (07_CICD_DEPLOY.md §6). Fails if the bootstrap's shape ever changes.
        run: ../deploy/version-web-build.sh build/web "$(echo "${{ github.sha }}" | cut -c1-12)"

      - name: check web DB assets shipped
        # A version skew between these and the drift/sqlite3 pub versions breaks
        # the web DB at boot with no error until the app is opened (CLAUDE.md).
        run: |
          test -f build/web/sqlite3.wasm || { echo "::error::sqlite3.wasm missing from build/web"; exit 1; }
          test -f build/web/drift_worker.js || { echo "::error::drift_worker.js missing from build/web"; exit 1; }

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: pos-web-${{ github.sha }}
          path: frontend/build/web
          retention-days: 14

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build web image
        # Context is frontend/ (the job's working-directory) so the Dockerfile's
        # COPY sees build/web; the Dockerfile itself lives in deploy/.
        run: |
          docker build -f ../deploy/web.Dockerfile \
            -t "$WEB_IMAGE:${{ github.sha }}" .

      - name: smoke test the web image
        # The image must be exactly the build output: the entry point, both web
        # DB assets, no nginx, and nothing configured to serve (no EXPOSE, the
        # base's default CMD). Nginx on the VM is stock; this image is inert.
        run: |
          docker run --rm "$WEB_IMAGE:${{ github.sha }}" sh -c '
            test -f /web/index.html &&
            test -f /web/sqlite3.wasm &&
            test -f /web/drift_worker.js &&
            main=$(grep -o "main\.[0-9a-z][0-9a-z]*\.dart\.js" /web/flutter_bootstrap.js) &&
            test -f "/web/$main" && ! test -e /web/main.dart.js &&
            grep -qF "$main" /web/sw.js &&
            ! command -v nginx
          ' || { echo "::error::web image contents are wrong"; exit 1; }
          [ "$(docker image inspect "$WEB_IMAGE:${{ github.sha }}" --format '{{len .Config.ExposedPorts}}')" = 0 ] \
            || { echo "::error::web image exposes a port"; exit 1; }

      # On every event (PR included), before any push: a fixable HIGH/CRITICAL stops the PR or the
      # release. Fix by bumping the busybox digest in deploy/web.Dockerfile, never an ignore file
      # (ADR-0013). Honest limit: busybox ships no package database, so Trivy finds no OS packages
      # to match CVEs against; this scan covers whatever it can identify in the image (and would
      # start covering OS packages the day the base changes to a distro image). What is scanned is
      # the single-arch linux/amd64 image built above; the push below is a separate buildx rebuild
      # of the same COPY-only Dockerfile and build/web, and its linux/arm64 half is never scanned.
      - name: Trivy — web image CVEs (amd64 build; a finding stops the job before the push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The trivy binary is pinned too, not left to the action (trivy-action supply-chain
          # incident 2026-03-19, CVE-2026-33634). Same version as server.yml's Trivy steps.
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Multi-arch (2026-10-13, 07 §3): the pushed tag is a manifest list of linux/amd64 (mob04) +
      # linux/arm64 (a Raspberry Pi 5). web.Dockerfile is a pinned multi-arch busybox + one COPY,
      # with no RUN, so the arm64 half needs no QEMU — but a multi-platform push needs a
      # docker-container builder, which the default `docker` driver is not.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: github.event_name != 'pull_request'

      - name: push web image (linux/amd64 + linux/arm64)
        if: github.event_name != 'pull_request'
        # Same Dockerfile and the same build/web the smoke test above passed; the main tag is still
        # main-only, and a workflow_dispatch still pushes only the immutable <sha> tag. No
        # provenance/SBOM attestations, so the list holds exactly the two images.
        run: |
          tags=(-t "$WEB_IMAGE:${{ github.sha }}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=(-t "$WEB_IMAGE:main")
          fi
          docker buildx build -f ../deploy/web.Dockerfile \
            --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            "${tags[@]}" --push .

      - name: assert the pushed tag holds linux/amd64 and linux/arm64
        if: github.event_name != 'pull_request'
        run: |
          ref="$WEB_IMAGE:${{ github.sha }}"
          platforms=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"')
          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<<"$platforms"; then
              echo "::error::$ref has no $want image (has: $(paste -sd' ' - <<<"$platforms"))"
              exit 1
            fi
          done
          echo "$ref: $(paste -sd' ' - <<<"$platforms")"

  flutter-ci-status:
    name: flutter-ci-status
    runs-on: ubuntu-latest
    needs: [changes, analyze-and-test, deps-audit, codegen-check, build-web]
    # #39: this is the only Flutter-side required check on `main`. It must report
    # on every PR — including a server-only one, where every job above (and
    # `changes` itself, on push/workflow_dispatch) is legitimately skipped — so
    # this uses `always()` to run unconditionally rather than `!cancelled()`,
    # which would let GitHub skip *this* job too when the whole run is cancelled;
    # a skipped required check is treated as passing, which is the false green
    # 07_CICD_DEPLOY.md §2 rule 4 warns about. `always()` is safe here only
    # because the result loop below explicitly fails on "cancelled" (and any
    # other non-success/non-skipped result) for every job in `needs` — bare
    # `always()` with no such check would itself be a false green.
    if: always()
    # No checkout here, so `frontend/` doesn't exist — override the workflow-level
    # working-directory or bash can't even start.
    defaults:
      run:
        working-directory: .
    steps:
      - name: require every job above to have succeeded or been skipped
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.analyze-and-test.result }}" \
            "${{ needs.deps-audit.result }}" \
            "${{ needs.codegen-check.result }}" \
            "${{ needs.build-web.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::a required Flutter job did not succeed: $result"
              exit 1
            fi
          done
          # On a push, `changes` must have classified it (true = code, false = docs only).
          if [[ "${{ github.event_name }}" == "push" && "${{ needs.changes.outputs.frontend }}" != "true" && "${{ needs.changes.outputs.frontend }}" != "false" ]]; then
            echo "::error::push was not classified by the changes job: '${{ needs.changes.outputs.frontend }}'"
            exit 1
          fi
          # A skipped release image on a `main` push of CODE is not a pass: that is how #39's skip
          # went unnoticed for every release (#184). A docs-only push (changes=false) builds none.
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" && "${{ needs.changes.outputs.frontend }}" == "true" && "${{ needs.build-web.result }}" != "success" ]]; then
            echo "::error::build-web did not run on a main push: ${{ needs.build-web.result }}"
            exit 1
          fi
