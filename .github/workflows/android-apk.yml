name: Android APK

# Manual release of the Android client. workflow_dispatch ONLY: routine pushes must never cut
# a release, and this workflow is not a required check (flutter.yml / server.yml own those).
# Builds ONE APK from main: the API build (USE_API_WRITES=true), signed with the project's stable
# key, attached to a prerelease. `target` picks the server it talks to and the private CA it trusts:
#   mob04 (default) -> https://172.30.58.20, assets/certs/pos-ca.crt as committed, tag `apk-<shortsha>`
#   pi5             -> https://100.70.181.98 (Tailscale IP: stable wherever the Pi moves, so the
#                      device needs the Tailscale app on the owner's tailnet), the Pi's own CA
#                      (assets/certs/pos-ca-pi5.crt copied over pos-ca.crt in the runner only),
#                      tag `apk-pi5-<shortsha>`
# `server_url` (optional, e.g. https://192.168.1.116) overrides the server only — `target` still picks
# the CA, so the host's certificate must name that address (CERT_SAN_IPS; ops/pi5-change-lan-ip.sh
# adds the shop's LAN IP). Tag `<prefix>-<host with dots as dashes>-<shortsha>`. Use it for shop
# devices on the Pi's LAN, which then need no Tailscale.
# Same package id + key: installing one build over another switches that device's server.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Server the APK talks to
        type: choice
        options: [mob04, pi5]
        default: mob04
      server_url:
        description: 'Optional server origin, e.g. https://192.168.1.116 (https, host[:port], no path). Empty = the target default.'
        type: string
        required: false
        default: ''

permissions:
  contents: write   # gh release create

env:
  FLUTTER_VERSION: '3.44.3'   # keep in sync with frontend/.fvmrc and flutter.yml
  # Origin only: every call site already passes '/api/v1/...' (api_client.dart).
  # API_BASE_URL / TAG_PREFIX are set by the first step (`server_url` is validated there first).
  DEFAULT_URL: ${{ inputs.target == 'pi5' && 'https://100.70.181.98' || 'https://172.30.58.20' }}
  BASE_PREFIX: ${{ inputs.target == 'pi5' && 'apk-pi5' || 'apk' }}

defaults:
  run:
    working-directory: frontend

jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: android-apk-${{ github.sha }}
    env:
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target || 'mob04' }}
      SERVER_URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v5

      # Validate before use: the value reaches $GITHUB_ENV, a --dart-define and the release notes.
      - name: resolve server URL
        working-directory: .
        run: |
          if [ -z "$SERVER_URL" ]; then
            api="$DEFAULT_URL"; prefix="$BASE_PREFIX"
          else
            if ! [[ "$SERVER_URL" =~ ^https://([a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?)(:[0-9]{1,5})?$ ]]; then
              # The raw value is not echoed: a newline in it could start a workflow command.
              echo "::error::server_url must be https://<host>[:port] (lowercase host, no path or trailing slash)"
              exit 1
            fi
            host="${BASH_REMATCH[1]}"
            api="$SERVER_URL"; prefix="$BASE_PREFIX-${host//./-}"
          fi
          {
            echo "API_BASE_URL=$api"
            echo "TAG_PREFIX=$prefix"
          } >> "$GITHUB_ENV"
          echo "API_BASE_URL=$api  TAG_PREFIX=$prefix"

      - name: fail fast if the release already exists
        working-directory: .
        run: |
          short="${SHA:0:7}"
          if gh release view "$TAG_PREFIX-$short" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG_PREFIX-$short already exists; delete it first or build a newer commit."
            exit 1
          fi

      - name: install stable signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is empty or missing; refusing to build with a throwaway key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Pi has its own private CA (not mob04's). Runner checkout only: nothing is committed.
      - name: trust the Pi's CA (target pi5)
        if: inputs.target == 'pi5'
        run: |
          cp assets/certs/pos-ca-pi5.crt assets/certs/pos-ca.crt
          openssl x509 -in assets/certs/pos-ca.crt -noout -subject -fingerprint -sha256

      - run: flutter pub get

      - name: build APK
        run: |
          short="${SHA:0:7}"
          mkdir -p ../apk-out
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=USE_API_WRITES=true \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "../apk-out/srisurart-pos-$TAG_PREFIX-$short.apk"

      - name: print signer certificate
        run: |
          short="${SHA:0:7}"
          # Version-named build-tools dirs only; ls | sort -V picks the newest.
          # shellcheck disable=SC2012
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "../apk-out/srisurart-pos-$TAG_PREFIX-$short.apk" | grep 'SHA-256'

      - name: create release
        working-directory: .
        run: |
          short="${SHA:0:7}"
          if [ -n "$SERVER_URL" ]; then
            reach="เครื่องต้องอยู่เครือข่ายเดียวกับ $API_BASE_URL และใบรับรองของเซิร์ฟเวอร์ต้องมีที่อยู่นี้ (The device must reach $API_BASE_URL directly, e.g. the shop LAN; the server certificate must name this address.)"
          elif [ "$TARGET" = pi5 ]; then
            reach="ต้องเปิดแอป Tailscale (tailnet ของ owner) บนเครื่องนี้ (The device must run Tailscale on the owner's tailnet.)"
          else
            reach="The device must be on the faculty network/VPN."
          fi
          cat > notes.md <<NOTES
          Commit: $SHA

          APK นี้เชื่อมต่อเซิร์ฟเวอร์ $API_BASE_URL (This build talks to the server at $API_BASE_URL). $reach

          เซ็นด้วยกุญแจถาวรของโปรเจกต์ ดังนั้นรุ่นถัด ๆ ไปติดตั้งทับได้ (Signed with the project's stable key, so later releases install over this one.)
          NOTES
          gh release create "$TAG_PREFIX-$short" apk-out/*.apk \
            --repo "$REPO" --target "$SHA" \
            --title "Android APK $TARGET${SERVER_URL:+ $API_BASE_URL} $short" --notes-file notes.md --prerelease
